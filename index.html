<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notepad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --canvas-bg:#E8E7E2;
    --canvas-dot:#D9D7D0;
    --ink:#242220;
    --ink-soft:#6F6B63;
    --ink-faint:#9C978D;
    --surface:#FBFAF6;
    --border:#E3DFD5;
    --accent:#22211E;
    --on-accent:#FFFFFF;
    --danger:#AF4A3C;
    --danger-soft:#F7E9E6;

    --card-paper-bg:#FBFAF6; --card-paper-text:#26241F; --card-paper-border:#E7E2D6;
    --card-pink-bg:#F5D9DF;  --card-pink-text:#3B242A;  --card-pink-border:#ECC5CD;
    --card-lime-bg:#E2FA5C;  --card-lime-text:#22270A;  --card-lime-border:#D2E84C;
    --card-sky-bg:#DCEAF4;   --card-sky-text:#1C2C36;   --card-sky-border:#C7DDEE;
    --card-dark-bg:#1E1D1B;  --card-dark-text:#F1EEE6;  --card-dark-border:#1E1D1B;

    --hover:#5b6cff;   /* hover colour for the dark round buttons (the app's --accent is near-black, so it can't show a hover) */
    --float-sh:0 30px 60px -20px rgba(40,50,90,.35), 0 8px 20px -8px rgba(40,50,90,.18);
    --ease:cubic-bezier(.2,.8,.2,1);

    color-scheme: light;
  }
  body.dark{
    --canvas-bg:#1A1917;
    --canvas-dot:#2A2825;
    --ink:#ECE9E2;
    --ink-soft:#B2AC9F;
    --ink-faint:#726C60;
    --surface:#242220;
    --border:#38352F;
    --accent:#ECE9E2;
    --on-accent:#1A1917;
    --danger:#C15A4B;
    --danger-soft:#3A211D;

    --card-paper-bg:#26241F; --card-paper-text:#EDEAE3; --card-paper-border:#38352E;
    --card-pink-bg:#3A2830;  --card-pink-text:#F0D8DF;  --card-pink-border:#4A323A;
    --card-lime-bg:#39420E;  --card-lime-text:#E9F99C;  --card-lime-border:#4B5714;
    --card-sky-bg:#1E2F38;  --card-sky-text:#CEE6F3;   --card-sky-border:#294049;
    --card-dark-bg:#F1EEE6; --card-dark-text:#1E1D1B;  --card-dark-border:#F1EEE6;
    --float-sh:0 30px 60px -20px rgba(0,0,0,.7);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    background:var(--canvas-bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition:background 0.2s ease, color 0.2s ease;
  }
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  input, textarea, [contenteditable]{font-family:inherit;}

  .app{ position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; }

  /* ---------------- BOARD / CANVAS ---------------- */
  .board{
    position:absolute; inset:0; z-index:0;
    overflow:auto;
    background-color:var(--canvas-bg);
    background-image:radial-gradient(var(--canvas-dot) 1.2px, transparent 1.2px);
    background-size:22px 22px;
    -webkit-overflow-scrolling:touch;
    transition:background-color 0.2s ease;
  }
  .board-inner.mode-free{ position:relative; width:100%; height:100%; transform-origin:0 0; }
  .board-inner.mode-masonry{
    display:flex; gap:14px; align-items:flex-start;
    width:100%; max-width:1400px; margin:0 auto;
    padding:72px 14px 110px 14px;
  }
  .masonry-col{ flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; }
  @media (min-width:700px){ .board-inner.mode-masonry{ gap:18px; padding:72px 22px 110px 22px; } .masonry-col{ gap:18px; } }

  .card{
    --cbg:var(--card-paper-bg); --ctext:var(--card-paper-text); --cborder:var(--card-paper-border);
    border-radius:24px;
    background:none; border:0;
    color:var(--ctext);
    display:flex; flex-direction:column;
    overflow:visible;
    user-select:none;
    cursor:pointer;
    transition:opacity 0.3s ease;   /* NOT transform: in free mode the card's transform holds its position + rotation */
    max-width:100%;
    position:relative;
  }
  /* the visible "paper" lives on .card-clip so it can float/lift without touching the card's own transform */
  .card-clip{
    overflow:hidden; border-radius:inherit; display:flex; flex-direction:column; flex:1; min-height:0; width:100%; height:100%;
    background:var(--cbg); border:1px solid var(--cborder); box-shadow:var(--float-sh);
    transition:translate 0.35s var(--ease), rotate 0.35s var(--ease), scale 0.35s var(--ease), box-shadow 0.35s ease;
  }
  /* unselected cards let a finger swipe scroll the board; only the selected (movable) card captures the touch to be dragged */
  .mode-free .card{ position:absolute; touch-action:pan-x pan-y; cursor:grab; }
  .mode-free .card.movable{ touch-action:none; }
  .mode-masonry .card{ touch-action:pan-y; width:100%; align-self:start; animation:card-in 0.2s ease both; }
  @keyframes card-in{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .card:hover .card-clip{ translate:0 -6px; rotate:-0.6deg; scale:1.03; }
  .card.dragging, .card.resizing, .card.rotating{ cursor:grabbing; transition:none; z-index:9999 !important; }
  .card.dragging .card-clip, .card.resizing .card-clip, .card.rotating .card-clip{ box-shadow:0 22px 44px -16px rgba(20,18,14,0.42); }
  /* no floating while dragging / resizing / rotating, while selected for moving, or in selection mode */
  .card.dragging .card-clip, .card.resizing .card-clip, .card.rotating .card-clip, .card.card-active .card-clip, body.selecting .card .card-clip{
    animation:none; translate:none; rotate:none; scale:none;
  }
  .card.color-pink{ --cbg:var(--card-pink-bg); --ctext:var(--card-pink-text); --cborder:var(--card-pink-border); }
  .card.color-lime{ --cbg:var(--card-lime-bg); --ctext:var(--card-lime-text); --cborder:var(--card-lime-border); }
  .card.color-sky{  --cbg:var(--card-sky-bg);  --ctext:var(--card-sky-text);  --cborder:var(--card-sky-border); }
  .card.color-dark{ --cbg:var(--card-dark-bg); --ctext:var(--card-dark-text); --cborder:var(--card-dark-border); }
  .card.faded{ opacity:0.22; pointer-events:none; }
  .card.select-dim{ opacity:0.5; }
  .card.selected{ outline:2.5px solid var(--accent); outline-offset:2px; }

  .card-swipe-wrap{ position:relative; width:100%; height:100%; display:flex; flex-direction:column; flex:1; min-height:0; background:inherit; }
  .card-delete-reveal{ opacity:0; position:absolute; inset:0; background:var(--danger); color:#fff; display:flex; align-items:center; justify-content:flex-end; padding-right:18px; font-size:13px; font-weight:600; border-radius:24px; z-index:0; }
  .card-inner{ position:relative; background:inherit; display:flex; flex-direction:column; flex:1; min-height:0; border-radius:inherit; transition:none; z-index:1; }

  .card-img{ width:100%; height:92px; flex-shrink:0; background-size:cover; background-position:center; }
  .card-body{ padding:14px 16px 12px 16px; display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
  .card-title{ font-weight:600; font-size:15px; line-height:1.25; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; flex-shrink:0; }
  .card-title.untitled{ opacity:0.5; font-weight:500; font-style:italic; }
  .card-snippet{ font-size:12.5px; line-height:1.55; opacity:0.82; flex:1; min-height:0; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:10; -webkit-box-orient:vertical; white-space:pre-wrap; }
  .mode-masonry .card-snippet{ font-size:13.5px; line-height:1.6; -webkit-line-clamp:14; }
  .card.sized .card-snippet{ -webkit-line-clamp:5; }
  .card-footer:has(.card-badges:empty){ display:none; }
  .card-photo-footer:has(.card-badges:empty){ display:none; }
  .card-footer{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:10px; font-size:11px; opacity:0.6; flex-shrink:0; }
  .card-badges{ display:flex; align-items:center; gap:6px; }

  .card.kind-quick .card-body{ justify-content:center; }
  .quick-text{ font-size:14.5px; line-height:1.55; font-weight:500; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:10; -webkit-box-orient:vertical; white-space:pre-wrap; }
  .card.sized .quick-text{ -webkit-line-clamp:6; }
  .quick-text.untitled{ opacity:0.45; font-style:italic; font-weight:400; }

  .card.color-paper.kind-note .card-title{ font-size:15.5px; }
  .card.color-paper.kind-note .card-snippet{ font-size:13px; line-height:1.6; opacity:0.72; }
  .mode-masonry .card.color-paper.kind-note .card-snippet{ font-size:13.5px; }

  /* ---- note / quick note: readable preview with a fade at the bottom ---- */
  .kind-note .card-body, .kind-quick .card-body{ position:relative; padding:20px 20px 16px 20px; }
  .kind-quick .card-body{ padding:18px 18px 14px 18px; }
  .pv{ position:relative; overflow:hidden; max-height:300px; flex:1 1 auto; min-height:0; color:var(--ctext); }
  .mode-masonry .pv{ max-height:360px; }
  .card.sized .pv{ max-height:none; }
  .pv.clipped::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:72px; background:linear-gradient(transparent, var(--cbg)); pointer-events:none; }
  .qpv{ max-height:170px; }
  .card.sized .qpv{ max-height:none; }
  .pv-title{ font-size:22px; line-height:1.08; letter-spacing:-0.03em; font-weight:700; margin:0 0 9px 0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; word-break:break-word; }
  .pv-title.untitled{ opacity:0.4; font-weight:600; }
  .pvb{ font-size:11.5px; line-height:1.5; }
  .mode-masonry .pvb{ font-size:12.5px; }
  .pvb h1{ font-size:15px; line-height:1.2; letter-spacing:-0.02em; font-weight:700; margin:10px 0 4px 0; }
  .pvb h2{ font-size:12.5px; line-height:1.25; font-weight:700; margin:10px 0 4px 0; }
  .pvb p, .pvb div, .pvb li{ margin:0 0 3px 0; color:var(--ctext); opacity:0.7; }
  .pvb ul{ list-style:none; margin:0; padding:0; }
  .pvb li{ position:relative; padding-left:13px; }
  .pvb li::before{ content:""; position:absolute; left:2px; top:0.6em; width:4px; height:4px; border-radius:50%; background:currentColor; opacity:0.45; }
  .hl, .pvb .hl{ background:#fbf04a; color:#14141c; border-radius:3px; padding:0 2px; box-decoration-break:clone; -webkit-box-decoration-break:clone; opacity:1; }
  .qpv .quick-text{ display:block; -webkit-line-clamp:unset; overflow:visible; font-size:13.5px; line-height:1.5; font-weight:500; word-break:break-word; }
  .mode-masonry .qpv .quick-text{ font-size:14px; }
  .kind-note .card-footer, .kind-quick .card-footer{ position:absolute; right:16px; bottom:10px; margin:0; z-index:2; }
  .card.kind-photo{ padding:0; }
  .card.kind-photo .card-photo-fill{ position:relative; width:100%; height:100%; flex:1; overflow:hidden; }
  .card.kind-photo .card-photo-fill img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-photo-footer{ position:absolute; left:0; right:0; bottom:0; padding:9px 11px; background:linear-gradient(to top, rgba(0,0,0,0.5), transparent); color:#fff; font-size:11px; display:flex; justify-content:space-between; align-items:center; }
  .card-photo-caption{ position:absolute; left:0; right:0; bottom:26px; padding:0 11px; color:#fff; font-size:12px; font-weight:500; text-shadow:0 1px 3px rgba(0,0,0,0.5); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .card.kind-audio .card-body, .card.kind-link .card-body{ justify-content:space-between; }
  .audio-icon, .audio-play-btn, .link-icon{ width:40px; height:40px; border-radius:50%; background:currentColor; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:none; padding:0; position:relative; }
  .audio-icon:before, .audio-play-btn:before, .link-icon:before{ content:''; position:absolute; inset:0; border-radius:50%; background:currentColor; opacity:0.14; }
  .audio-icon svg, .audio-play-btn svg, .link-icon svg{ position:relative; color:var(--card-paper-bg); }
  .card.color-pink .audio-icon svg, .card.color-pink .audio-play-btn svg, .card.color-pink .link-icon svg{ color:var(--card-pink-bg); }
  .card.color-lime .audio-icon svg, .card.color-lime .audio-play-btn svg, .card.color-lime .link-icon svg{ color:var(--card-lime-bg); }
  .card.color-sky .audio-icon svg, .card.color-sky .audio-play-btn svg, .card.color-sky .link-icon svg{ color:var(--card-sky-bg); }
  .card.color-dark .audio-icon svg, .card.color-dark .audio-play-btn svg, .card.color-dark .link-icon svg{ color:var(--card-dark-bg); }
  .audio-play-btn:before{ opacity:0.16; }
  .audio-play-btn.playing:before{ opacity:0.9; }
  .audio-row, .link-row{ display:flex; align-items:center; gap:10px; }
  .audio-label, .link-domain{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .audio-label.untitled{ opacity:0.5; font-style:italic; font-weight:500; }
  .link-url{ font-size:11.5px; opacity:0.6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }

  .resize-handle{ position:absolute; right:2px; bottom:2px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; color:currentColor; opacity:0.55; cursor:nwse-resize; touch-action:none; z-index:6; }
  .resize-handle:hover{ opacity:1; }
  .card.card-active{ outline:2px solid var(--accent); outline-offset:2px; }
  .delete-badge{ position:absolute; right:-10px; top:-10px; width:27px; height:27px; border-radius:50%; background:var(--danger); color:#fff; border:2px solid var(--canvas-bg); display:flex; align-items:center; justify-content:center; z-index:7; box-shadow:0 4px 10px -3px rgba(0,0,0,0.45); }
  .delete-badge:hover{ filter:brightness(1.08); }
  .rotate-handle{ position:absolute; right:-10px; top:23px; width:27px; height:27px; border-radius:50%; background:var(--surface); border:2px solid var(--border); color:var(--ink); display:flex; align-items:center; justify-content:center; z-index:6; cursor:grab; touch-action:none; box-shadow:0 4px 10px -3px rgba(0,0,0,0.3); }
  .rotate-handle:hover{ background:var(--border); }
  .lock-icon-badge{ position:absolute; left:8px; top:8px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,0.35); color:#fff; display:flex; align-items:center; justify-content:center; opacity:0.85; z-index:2; }

  .empty-canvas{ position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); text-align:center; color:var(--ink-faint); pointer-events:none; width:280px; }
  .empty-canvas .glyph{ width:44px;height:44px;border-radius:50%;border:1px solid var(--border); display:flex;align-items:center;justify-content:center;margin:0 auto 14px auto;color:var(--ink-faint); background:var(--surface); }
  .empty-canvas h2{ font-size:18px; font-weight:600; color:var(--ink-soft); margin:0 0 4px 0; }
  .empty-canvas p{ font-size:13.5px; line-height:1.5; margin:0; }

  /* ---------------- MARQUEE SELECT ---------------- */
  .marquee-box{ position:absolute; border:1.5px solid var(--accent); background:rgba(34,33,30,0.1); border-radius:4px; pointer-events:none; z-index:40; }
  body.dark .marquee-box{ background:rgba(236,233,226,0.12); }

  /* ---------------- FLOATING CHROME ---------------- */
  .float{ position:absolute; z-index:50; }
  .round-btn{ width:38px; height:38px; border-radius:50%; background:var(--surface); border:1px solid var(--border); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px -8px rgba(20,18,14,0.25); transition:background 0.15s ease, color 0.15s ease; flex-shrink:0; }
  .round-btn:hover{ color:var(--ink); }
  .round-btn.active{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }

  .folders-wrap{ top:18px; left:18px; }
  .folders-panel{ position:absolute; top:46px; left:0; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:6px; min-width:200px; max-height:min(60vh,420px); overflow-y:auto; box-shadow:0 16px 34px -14px rgba(20,18,14,0.35); display:flex; flex-direction:column; gap:2px; }
  .folders-panel[hidden]{ display:none; }
  .folder-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border-radius:9px; font-size:13.5px; color:var(--ink); }
  .folder-row:hover{ background:var(--border); }
  .folder-row.active{ background:var(--accent); color:var(--on-accent); }
  .folder-row .fr-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; text-align:left; background:none; border:none; color:inherit; font-size:inherit; padding:0; }
  .folder-row .fr-del{ opacity:0.5; background:none; border:none; color:inherit; font-size:14px; flex-shrink:0; }
  .folder-row .fr-del:hover{ opacity:1; }

  .top-right-btns{ position:absolute; top:18px; right:18px; z-index:55; display:flex; gap:8px; }

  .zoom-wrap{ left:18px; bottom:calc(44px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .zoom-wrap[hidden]{ display:none; }
  .zoom-slider-pop{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:12px 8px; box-shadow:0 8px 22px -10px rgba(20,18,14,0.3); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .zoom-slider-pop[hidden]{ display:none; }
  .zoom-pct{ font-size:11px; color:var(--ink-soft); font-weight:500; background:none; border:none; padding:4px 6px; border-radius:8px; min-width:44px; }
  .zoom-pct:hover{ background:var(--border); }
  .zoom-mini{ width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:18px; line-height:1; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .zoom-mini:active{ background:var(--border); }
  .zoom-mini.zoom-fit{ font-size:11px; font-weight:600; }
  .zoom-track{ position:relative; width:40px; height:170px; height:clamp(80px, calc(100dvh - 300px), 170px); touch-action:none; cursor:pointer; outline:none; flex-shrink:0; }
  .zoom-track-line{ position:absolute; left:50%; top:11px; bottom:11px; width:4px; margin-left:-2px; border-radius:2px; background:var(--border); }
  .zoom-tick{ position:absolute; left:50%; width:14px; margin-left:-7px; height:2px; border-radius:1px; background:var(--ink-soft); opacity:0.5; }
  .zoom-thumb{ position:absolute; left:50%; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; background:var(--accent); border:2px solid var(--surface); box-shadow:0 2px 8px -2px rgba(20,18,14,0.45); }
  .zoom-track:focus-visible .zoom-thumb{ outline:2px solid var(--accent); outline-offset:2px; }

  .scenes-wrap{ left:66px; bottom:calc(44px + env(safe-area-inset-bottom,0px)); }
  .scenes-wrap[hidden]{ display:none; }
  .scenes-panel{ position:absolute; bottom:46px; left:0; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:6px; min-width:190px; max-height:50vh; overflow-y:auto; box-shadow:0 16px 34px -14px rgba(20,18,14,0.35); display:flex; flex-direction:column; gap:2px; }
  .scenes-panel[hidden]{ display:none; }
  .scene-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; padding:9px 10px; border-radius:9px; font-size:13.5px; }
  .scene-row:hover{ background:var(--border); }
  .scene-row .sc-name{ flex:1; text-align:left; background:none; border:none; color:var(--ink); font-size:inherit; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scene-row .sc-del{ opacity:0.5; background:none; border:none; color:var(--ink); font-size:14px; }
  .scene-add-row{ display:flex; gap:4px; padding:4px; }
  .scene-add-row input{ flex:1; border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:13px; outline:none; background:var(--canvas-bg); color:var(--ink); }
  .scene-add-row button{ background:var(--accent); color:var(--on-accent); border:none; border-radius:8px; padding:0 10px; font-size:16px; }

  .fab-cluster{ position:absolute; right:22px; bottom:calc(36px + env(safe-area-inset-bottom,0px)); z-index:50; display:flex; align-items:center; gap:10px; }
  .fab{ width:54px; height:54px; border-radius:50%; background:var(--accent); color:var(--on-accent); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px -8px rgba(0,0,0,0.45); font-size:24px; font-weight:300; transition:transform 0.15s ease, background 0.2s ease, color 0.2s ease; flex-shrink:0; }
  .fab:hover{ transform:scale(1.06); }
  .fab:active{ transform:scale(0.96); }
  .fab.open{ transform:rotate(45deg); }

  .fab-menu{ position:absolute; right:22px; bottom:calc(100px + env(safe-area-inset-bottom,0px)); z-index:51; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:0 16px 34px -14px rgba(20,18,14,0.35); padding:6px; display:flex; flex-direction:column; gap:2px; min-width:180px; animation:menu-in 0.14s ease; }
  .fab-menu[hidden]{ display:none; }
  @keyframes menu-in{ from{ opacity:0; transform:translateY(6px) scale(0.97); } to{ opacity:1; transform:translateY(0) scale(1); } }

    --fw-mute:rgba(128,128,128,0.85); --fw-line:rgba(128,128,128,0.28); --fw-soft:rgba(128,128,128,0.14);

  @supports (color: color-mix(in srgb, red, blue)){

  .aud-wave i.on{ background:var(--hover); }
  #audioEditorInner .audio-title-input{ max-width:320px; font-size:22px; letter-spacing:-0.02em; }
  .fwin .pill-btn{ border:1px solid var(--fw-line); opacity:1; padding:8px 16px; transition:background 0.2s ease; cursor:pointer; }
  .fwin .pill-btn:hover{ background:var(--fw-soft); }
  .fwin .pill-btn[hidden]{ display:none; }
  @media (prefers-reduced-motion:reduce){ .record-btn.recording::before, .record-btn.recording::after{ animation:none; } }

  /* ---- LINK: card chip ---- */
  .card.kind-link .card-body{ position:relative; justify-content:center; padding:16px 16px 16px 14px; }
  .card.kind-link .link-row{ gap:12px; }
  .card.kind-link .link-icon{ width:48px; height:48px; background:var(--ctext); color:var(--cbg); cursor:pointer; transition:transform 0.2s var(--ease), background 0.2s ease; }
  .card.kind-link .link-icon:before{ display:none; }
  .card.kind-link .link-icon svg{ color:var(--cbg); width:22px; height:22px; }
  .card.kind-link .link-icon:hover{ background:var(--hover); transform:scale(1.1) rotate(-8deg); }
  .card.kind-link .link-icon:hover svg{ color:#fff; }
  .card.kind-link .link-icon:active{ transform:scale(0.94); }
  .link-meta{ flex:1; min-width:0; }
  .link-meta .link-domain{ display:block; letter-spacing:-0.01em; }
  .link-meta .link-url{ display:block; margin-top:3px; }
  .card.kind-link .card-footer{ position:absolute; top:8px; right:12px; margin:0; }

  /* ---- LINK: floating window ---- */
  #linkEditorInner{ margin:auto 0; padding:32px 28px 24px; }
  #linkEditorInner .link-editor-center{ gap:16px; padding-top:0; }
  .link-icon-big{ width:96px; height:96px; border:0; border-radius:50%; background:var(--fw-ink); color:var(--fw-bg); cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; transition:transform 0.25s var(--ease), background 0.25s ease, color 0.25s ease; }
  .link-icon-big:before{ display:none; }
  .link-icon-big:hover{ background:var(--hover); color:#fff; transform:scale(1.07) rotate(-8deg); }
  .link-icon-big:active{ transform:scale(0.95); }
  #linkEditorInner .link-title-input{ max-width:340px; font-size:22px; font-weight:600; letter-spacing:-0.02em; }
  #linkEditorInner .link-url-input{ max-width:340px; border:1px solid var(--fw-line); border-radius:14px; padding:12px 16px; font-size:14px; opacity:1; transition:border-color 0.2s ease, box-shadow 0.2s ease; }
  #linkEditorInner .link-url-input:focus{ border-color:var(--hover); box-shadow:0 0 0 4px rgba(91,108,255,0.15); }
  #linkEditorInner .link-url-input.bad{ border-color:var(--danger); }
  .link-hint{ font-size:12px; color:var(--danger); min-height:16px; text-align:center; }
  .fwin .pill-btn.main{ background:var(--fw-ink); color:var(--fw-bg); border-color:var(--fw-ink); }
  .fwin .pill-btn.main:hover{ background:var(--hover); border-color:var(--hover); color:#fff; }

  /* ---- PHOTO: card (thin frame + rounded photo + dark gradient with the caption) ---- */
  .card.kind-photo .card-clip{ padding:8px; }
  .card.kind-photo .card-photo-fill{ border-radius:17px; }
  .card.kind-photo.auto-size .card-photo-fill img{ height:auto; min-height:190px; max-height:380px; object-fit:cover; }
  .card-photo-footer, .card-photo-footer:has(.card-badges:empty){ display:flex; align-items:flex-end; justify-content:space-between; gap:8px; padding:40px 14px 12px; background:linear-gradient(transparent, rgba(0,0,0,0.5)); }
  .card-photo-caption{ position:static; padding:0; flex:1; min-width:0; font-size:13px; font-weight:600; bottom:auto; }

  /* ---- PHOTO: floating window ---- */
  #photoEditorInner{ height:auto; padding:18px; display:flex; flex-direction:column; align-items:stretch; gap:14px; }
  .pw-stage{ flex:1; min-height:200px; border-radius:18px; overflow:hidden; background:var(--fw-soft); display:grid; place-items:center; cursor:zoom-in; position:relative; }
  .pw-stage.z{ cursor:zoom-out; touch-action:none; }
  .pw-stage img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; transition:transform 0.35s var(--ease); user-select:none; -webkit-user-drag:none; }
  .pw-stage.panning img{ transition:none; }
  .pw-stage.drag{ outline:2px dashed var(--hover); outline-offset:-8px; }
  .pw-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:0 4px 2px; }
  #photoCaptionInput{ flex:1; width:auto; min-width:140px; text-align:left; font-size:20px; font-weight:600; letter-spacing:-0.02em; }
  .fwin[data-kind="photo"] .fw-x{ top:26px; right:26px; background:rgba(20,20,30,0.5); color:#fff; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .fwin[data-kind="photo"] .fw-x:hover{ background:var(--hover); }

  /* ---- FOLDER: card (fan of real mini cards + info strip) ---- */
  .fold-in{ position:relative; height:230px; padding:16px 18px; overflow:hidden; }
  .card.sized .fold-in{ height:100%; min-height:190px; }
  .fold-stack{ position:relative; height:130px; }
  .mc{ position:absolute; left:50%; bottom:-20px; width:92px; height:118px; margin-left:-46px; border-radius:12px; background:var(--cbg); color:var(--ctext); box-shadow:0 8px 18px -6px rgba(40,50,90,0.35), 0 0 0 1px var(--cborder); padding:9px; overflow:hidden; transform-origin:50% 120%; transition:transform 0.45s var(--ease); }
  .mc.m1{ transform:translateX(-46px) rotate(-14deg); }
  .mc.m2{ transform:translateX(46px) rotate(14deg); }
  .mc.m0{ transform:translateY(-6px); }
  .card:hover .mc.m1{ transform:translateX(-58px) rotate(-19deg); }
  .card:hover .mc.m2{ transform:translateX(58px) rotate(19deg); }
  .card:hover .mc.m0{ transform:translateY(-16px); }
  .mc.color-pink{ --cbg:var(--card-pink-bg); --ctext:var(--card-pink-text); --cborder:var(--card-pink-border); }
  .mc.color-lime{ --cbg:var(--card-lime-bg); --ctext:var(--card-lime-text); --cborder:var(--card-lime-border); }
  .mc.color-sky{  --cbg:var(--card-sky-bg);  --ctext:var(--card-sky-text);  --cborder:var(--card-sky-border); }
  .mc.color-dark{ --cbg:var(--card-dark-bg); --ctext:var(--card-dark-text); --cborder:var(--card-dark-border); }
  .mc.mp{ padding:0; }
  .mc-im{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .mc-t{ font-size:8.5px; font-weight:700; line-height:1.2; letter-spacing:-0.01em; margin-bottom:4px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .mc-p{ font-size:6.5px; line-height:1.5; opacity:0.7; overflow:hidden; max-height:80px; }
  .mc-p.big{ font-size:8px; opacity:1; font-weight:500; }
  .mc-ic{ display:grid; place-items:center; height:70px; }
  .mc-ic svg{ width:26px; height:26px; }
  .mc-lb{ font-size:7px; text-align:center; opacity:0.75; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .mc.empty{ display:grid; place-items:center; font-size:10px; opacity:0.7; }
  .fold-info{ position:absolute; left:0; right:0; bottom:0; height:76px; padding:0 18px; display:flex; align-items:center; gap:12px; background:var(--cbg); box-shadow:0 -10px 18px -6px var(--cbg); }
  .fold-ico{ width:38px; height:38px; border-radius:12px; background:var(--ctext); color:var(--cbg); display:grid; place-items:center; flex:none; }
  .fold-txt{ flex:1; min-width:0; }
  .fold-txt b{ display:block; font-size:15px; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fold-txt small{ font-size:12px; opacity:0.6; }
  .fold-del{ position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:0; background:rgba(128,128,128,0.16); color:var(--ctext); display:grid; place-items:center; cursor:pointer; z-index:3; padding:0; opacity:0; transform:scale(0.8); transition:opacity 0.2s ease, transform 0.2s ease, background 0.2s ease, color 0.2s ease; }
  .card:hover .fold-del, .fold-del:focus-visible{ opacity:1; transform:none; }
  @media (hover:none){ .fold-del{ opacity:1; transform:none; } }
  .fold-del:hover{ background:var(--danger); color:#fff; }

  /* ---- FOLDER: floating window ---- */
  #folderEditorInner{ height:auto; min-height:0; padding:0; max-width:none; display:flex; flex-direction:column; }
  .fold-head{ padding:26px 30px 14px; display:flex; align-items:center; gap:14px; }
  .is-child #folderEditorInner{ padding-top:0; }
  .fold-name{ flex:1; min-width:0; border:0; background:none; outline:none; font-size:clamp(26px,5vw,38px); font-weight:700; letter-spacing:-0.03em; color:inherit; font-family:inherit; padding:0; }
  .fold-name::placeholder{ color:currentColor; opacity:0.28; }
  .fold-cnt{ font-size:13px; color:var(--fw-mute); white-space:nowrap; margin-right:44px; }
  .fgrid{ flex:1; min-height:0; overflow-x:hidden; overflow-y:auto; padding:6px 30px 120px; scrollbar-width:none; -ms-overflow-style:none; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .fcols{ display:flex; gap:14px; align-items:flex-start; }
  .fcol{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:14px; }
  .fgrid.relayout .card{ animation:none; }
  .fgrid::-webkit-scrollbar{ display:none; }
  .fgrid .card{ position:relative; width:100%; flex:none; display:flex; cursor:pointer; animation:fpop 0.4s var(--ease) both; }
  @keyframes fpop{ from{ opacity:0; transform:scale(0.9) translateY(10px); } }
  .fgrid .card-clip{ animation:none; box-shadow:0 8px 22px -10px rgba(40,50,90,0.35); }
  .fgrid .card.kind-photo.auto-size .card-photo-fill img{ max-height:300px; min-height:120px; }
  .fgrid .card .fx{ position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%; border:0; background:rgba(20,20,30,0.55); color:#fff; display:grid; place-items:center; padding:0; cursor:pointer; opacity:0; transition:opacity 0.2s ease, background 0.2s ease; z-index:4; }
  .fgrid .card:hover .fx, .fgrid .card .fx:focus-visible{ opacity:1; }
  @media (hover:none){ .fgrid .card .fx{ opacity:1; } }
  .fgrid .card .fx:hover{ background:var(--danger); }
  .femp{ text-align:center; color:var(--fw-mute); font-size:14px; padding:60px 0; line-height:1.6; }
  .fadd{ position:absolute; right:24px; bottom:72px; display:flex; flex-direction:column; align-items:flex-end; gap:10px; z-index:4; }
  .fmenu{ display:flex; flex-direction:column; gap:2px; padding:6px; background:var(--fw-bg); border-radius:22px; box-shadow:var(--float-sh), 0 0 0 1px var(--fw-line); transform-origin:100% 100%; opacity:0; transform:translateY(14px) scale(0.9); pointer-events:none; transition:opacity 0.2s ease, transform 0.3s var(--ease); }
  .fadd.open .fmenu{ opacity:1; transform:none; pointer-events:auto; }
  .fmenu button{ display:flex; align-items:center; gap:12px; border:0; background:none; color:inherit; font-size:14px; font-weight:500; padding:8px 20px 8px 8px; border-radius:16px; cursor:pointer; white-space:nowrap; opacity:0; transform:translateY(10px); transition:opacity 0.25s ease, transform 0.3s var(--ease), background 0.2s ease; }
  .fadd.open .fmenu button{ opacity:1; transform:none; transition-delay:calc(var(--i)*45ms), calc(var(--i)*45ms), 0s; }
  .fmenu button:hover{ background:var(--fw-soft); }
  .fmi{ width:32px; height:32px; border-radius:50%; background:var(--fw-ink); color:var(--fw-bg); display:grid; place-items:center; flex:none; transition:background 0.2s ease, transform 0.2s ease; }
  .fmenu button:hover .fmi{ background:var(--hover); color:#fff; transform:rotate(-8deg) scale(1.08); }
  .fplus{ width:54px; height:54px; border-radius:50%; border:0; background:var(--fw-ink); color:var(--fw-bg); display:grid; place-items:center; cursor:pointer; padding:0; box-shadow:var(--float-sh); transition:transform 0.35s var(--ease), background 0.2s ease, color 0.2s ease; }
  .fplus:hover{ background:var(--hover); color:#fff; transform:scale(1.07); }
  .fadd.open .fplus{ transform:rotate(135deg); background:var(--hover); color:#fff; }

  /* back pill (only for an item opened from inside a folder) */
  .fw-back{ display:none; position:absolute; top:16px; left:16px; height:34px; padding:0 14px 0 9px; align-items:center; gap:4px; border:0; border-radius:999px; background:var(--fw-soft); color:inherit; font-size:13px; font-weight:600; z-index:6; max-width:55%; cursor:pointer; transition:background 0.2s ease, color 0.2s ease; }
  .fw-back span{ overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .fw-back:hover{ background:var(--hover); color:#fff; }
  .fwin.is-child .fw-back{ display:flex; }
  .fwin.is-child #noteEditorInner{ padding-top:68px; }
  .fwin.is-child #quickEditorInner{ padding-top:62px; }
  .fwin.is-child #photoEditorInner{ padding-top:62px; }
  .fwin[data-kind="photo"] .fw-back{ background:rgba(20,20,30,0.5); color:#fff; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); top:26px; left:26px; }
  .fwin[data-kind="photo"].is-child .fw-x{ top:26px; }

  /* delete confirmation over a blurred background */
  .modal-overlay.blur{ -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .modal-btn.cancel:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .toast:not([hidden]){ cursor:pointer; }
  #folderCircleBtn[hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- CANVAS BOARD -->
  <div class="board" id="board">
    <div class="board-inner mode-free" id="boardInner"></div>
  </div>
  <div class="empty-canvas" id="emptyCanvas" hidden>
    <div class="glyph">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/></svg>
    </div>
    <h2>No notes yet</h2>
    <p>Tap the plus button to drop your first note on the board.</p>
  </div>
  <div class="marquee-box" id="marqueeBox" hidden></div>

  <!-- FOLDERS DROPDOWN -->
  <div class="float folders-wrap" id="foldersWrap">
    <button class="round-btn" id="foldersBtn" title="Folders">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.6 12.5L12.5 20.6a2 2 0 01-2.8 0l-7.3-7.3a2 2 0 010-2.8L10.5 2.4a2 2 0 011.4-.6H19a1 1 0 011 1v6.7a2 2 0 01-.6 1.4z"/><circle cx="15" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
    </button>
    <div class="folders-panel" id="foldersPanel" hidden></div>
  </div>

  <!-- TOP RIGHT: theme only -->
  <div class="top-right-btns">
    <button class="round-btn" id="themeToggle" title="Toggle dark mode"></button>
  </div>

  <!-- ZOOM -->
  <div class="float zoom-wrap" id="zoomWrap">
    <div class="zoom-slider-pop" id="zoomSliderPop" hidden>
      <button class="zoom-pct" id="zoomPct" title="Reset to 100%">100%</button>
      <button class="zoom-mini" id="zoomInBtn" title="Zoom in">+</button>
      <div class="zoom-track" id="zoomSlider" role="slider" tabindex="0" aria-orientation="vertical" aria-label="Zoom" aria-valuemin="40" aria-valuemax="220" aria-valuenow="100">
        <div class="zoom-track-line"></div>
        <div class="zoom-tick" id="zoomTick"></div>
        <div class="zoom-thumb" id="zoomThumb"></div>
      </div>
      <button class="zoom-mini" id="zoomOutBtn" title="Zoom out">&minus;</button>
      <button class="zoom-mini zoom-fit" id="zoomFitBtn" title="Fit all notes">Fit</button>
    </div>
    <button class="round-btn" id="zoomBtn" title="Zoom">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M16 3h3a2 2 0 012 2v3"/><path d="M8 21H5a2 2 0 01-2-2v-3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>
    </button>
  </div>

  <!-- SCENES -->
  <div class="float scenes-wrap" id="scenesWrap">
    <div class="scenes-panel" id="scenesPanel" hidden></div>
    <button class="round-btn" id="scenesBtn" title="Scenes">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
    </button>
  </div>

  <!-- SELECTION BAR -->
  <div class="selection-bar" id="selectionBar" hidden>
    <span class="sel-count" id="selCount">1 selected</span>
    <div class="sel-folder-wrap">
      <button class="sel-btn" id="selFolderBtn" title="Move to folder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
        Folder
      </button>
      <div class="sel-folder-pop" id="selFolderPop" hidden></div>
    </div>
    <button class="sel-btn" id="selDeleteBtn" title="Delete selected">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      Delete
    </button>
    <button class="sel-done" id="selDoneBtn" title="Done">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- FAB CLUSTER -->
  <div class="fab-cluster">
    <button class="round-btn" id="arrangeToggle" title="Arrange notes in a grid"></button>
    <div style="position:relative;">
      <div class="fab-menu" id="fabMenu" hidden>
        <button data-action="new-note">
          <span class="fm-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg></span>
          New note
        </button>
        <button data-action="new-quick">
          <span class="fm-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><polygon points="13 2 3 14 11 14 9 22 21 10 13 10 13 2"/></svg></span>
          Quick note
        </button>
        <button data-action="new-photo">
          <span class="fm-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg></span>
          Photo / GIF
        </button>
        <button data-action="new-folder-item">
          <span class="fm-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          Folder
        </button>
        <button data-action="new-audio">
          <span class="fm-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/></svg></span>
          Audio
        </button>
        <button data-action="new-link" id="newLinkMenuBtn">
          <span class="fm-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1.5-1.5"/></svg></span>
          Link
        </button>
        <button data-action="paste" id="pasteMenuBtn">
          <span class="fm-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h2"/></svg></span>
          Paste
        </button>
        <div class="fm-sep"></div>
        <button data-action="new-folder" id="newFolderMenuBtn">
          <span class="fm-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg></span>
          New folder
        </button>
      </div>
      <button class="fab" id="fabNew" title="Add (Ctrl/Cmd+N)">+</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var STORAGE_NOTES = 'notepad_notes_v3';
  var STORAGE_FOLDERS = 'notepad_folders_v1';
  var STORAGE_THEME = 'notepad_theme_v1';
  var STORAGE_MODE = 'notepad_mode_v1';
  var STORAGE_SCENES = 'notepad_scenes_v1';
  var COLORS = ['paper','pink','lime','sky','dark'];
  var CARD_W_MIN=140, CARD_W_MAX=460, CARD_H_MIN=110, CARD_H_MAX=460;
  var BOARD_OFFSET = 3000; // legacy origin: only used to convert views/scenes saved before the board became dynamic
  // Dynamic board: the origin (offX/offY) and size follow the content, so the board grows as notes need space.
  var offX = BOARD_OFFSET, offY = BOARD_OFFSET;
  var BOARD_PAD = 6;       // small breathing room (logical px) kept around the outermost note
  // temporary extra room added while a note is being dragged against a board edge (reset on drop)
  var dragExtra = {l:0, r:0, t:0, b:0};

  var notes = [];
  var folders = [];
  var scenes = [];
  var selectedFolder = 'all';
  var openNoteId = null;
  var fwOpen = false, fwCloseTimer = null, fwBox = null, fwDirty = false, fwOpenedAt = 0;   // floating window state
  var zTop = 10;
  var saveTimer = null;
  var pendingDeleteNoteId = null;
  var pendingDeleteFolderId = null;
  var pendingDeleteNoteIds = null;
  var boardMode = 'free';
  var boardZoom = 1;
  var selectionMode = false;
  var activeCardId = null;
  var selectedIds = {};

  var mediaRecorder = null, recordedChunks = [], recordStartTime = 0, recordTimerInterval = null;
  var currentAudioEl = null, currentAudioNoteId = null;
  var audioInfo = {}, audioMsg = '', recNoteId = null, recCtx = null, recAnalyser = null, recPeaks = [];   // audioInfo[id] = {src, dur, peaks}

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  // ---------- PERSISTENCE ----------
  function migrateFromOlder(){
    if(notes.length) return;
    ['notepad_notes_v2','notepad_notes_v1'].forEach(function(key){
      if(notes.length) return;
      try{
        var legacy = JSON.parse(localStorage.getItem(key) || '[]');
        if(legacy.length) notes = legacy.map(function(n){ n.kind = n.kind || 'note'; return n; });
      }catch(e){}
    });
  }

  function loadState(){
    try{ folders = JSON.parse(localStorage.getItem(STORAGE_FOLDERS) || '[]'); }catch(e){ folders = []; }
    try{ scenes = JSON.parse(localStorage.getItem(STORAGE_SCENES) || '[]'); }catch(e){ scenes = []; }
    try{ boardMode = localStorage.getItem(STORAGE_MODE) || 'free'; }catch(e){ boardMode = 'free'; }
    var col = 0, row = 0;
    notes.forEach(function(n){
      if(!n.kind) n.kind = 'note';
      if(n.kind === 'folder' && !Array.isArray(n.items)) n.items = [];
      if(typeof n.x !== 'number'){ n.x = (col%5)*236 - 470; n.y = row*210 - 210; col++; if(col>4){col=0; row++;} }
      if(typeof n.rot !== 'number') n.rot = Math.round((Math.random()*6-3)*10)/10;
      if(!n.color) n.color = 'paper';
      if(typeof n.w !== 'number') n.w = defaultSize(n.kind).w;
      if(typeof n.h !== 'number') n.h = defaultSize(n.kind).h;
      if(typeof n.sized !== 'boolean') n.sized = false;
      if(typeof n.locked !== 'boolean') n.locked = false;
      if(typeof n.grouped !== 'boolean') n.grouped = false;
      if(typeof n.image === 'undefined') n.image = null;
      if(typeof n.audio === 'undefined') n.audio = null;
      if(typeof n.url === 'undefined') n.url = null;
      if(typeof n.title === 'undefined') n.title = '';
      if(typeof n.body === 'undefined') n.body = '';
      if(typeof n.z !== 'number') n.z = ++zTop; else if(n.z > zTop) zTop = n.z;
      if(n.kind === 'note'){
        if(n.image && (n.body||'').indexOf(n.image) === -1){ n.body = '<img src="'+n.image+'">' + (n.body||''); n.image = null; }
        if(n.audio && (n.body||'').indexOf(n.audio) === -1){ n.body = (n.body||'') + '<span contenteditable="false"><audio controls src="'+n.audio+'"></audio></span>'; n.audio = null; }
      }
    });
  }
  // ---- Notes live in IndexedDB (localStorage is ~5MB and silently fails once photos fill it) ----
  var IDB = (function(){
    var dbp = null;
    function open(){
      if(dbp) return dbp;
      dbp = new Promise(function(res, rej){
        if(!window.indexedDB){ rej(new Error('no idb')); return; }
        var r = indexedDB.open('notepad_db', 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      });
      return dbp;
    }
    function get(k){
      return open().then(function(db){ return new Promise(function(res, rej){
        var q = db.transaction('kv','readonly').objectStore('kv').get(k);
        q.onsuccess = function(){ res(q.result); }; q.onerror = function(){ rej(q.error); };
      }); });
    }
    function set(k, v){
      return open().then(function(db){ return new Promise(function(res, rej){
        var tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
        tx.onabort = function(){ rej(tx.error); };
      }); });
    }
    return { get:get, set:set };
  })();

  var stateLoaded = false, writing = false, writePending = false, notesFromLegacy = false, toastTimer = null;

  function showToast(msg, ok){
    var t = document.getElementById('toast');
    if(!t) return;
    t.classList.toggle('ok', !!ok);
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, 4500);
  }
  function clearLegacyNotes(){
    try{ ['notepad_notes_v3','notepad_notes_v2','notepad_notes_v1'].forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  }
  function loadNotesAsync(){
    return IDB.get('notes').catch(function(){ return undefined; }).then(function(v){
      if(Array.isArray(v)) return v;
      var legacy = [];
      ['notepad_notes_v3','notepad_notes_v2','notepad_notes_v1'].forEach(function(key){
        if(legacy.length) return;
        try{ var l = JSON.parse(localStorage.getItem(key) || '[]'); if(l.length) legacy = l; }catch(e){}
      });
      notesFromLegacy = legacy.length > 0;
      return legacy;
    });
  }
  function persistNotes(){
    if(!stateLoaded) return;
    if(writing){ writePending = true; return; }
    writing = true;
    IDB.set('notes', notes).then(function(){ clearLegacyNotes(); }).catch(function(){
      try{ localStorage.setItem(STORAGE_NOTES, JSON.stringify(notes)); }
      catch(e){ showToast("Couldn't save — this device's storage is full."); }
    }).then(function(){
      writing = false;
      if(writePending){ writePending = false; persistNotes(); }
    });
  }
  function flushSave(){ clearTimeout(saveTimer); persistNotes(); }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') flushSave(); });
  window.addEventListener('pagehide', flushSave);
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  function persistFolders(){ try{ localStorage.setItem(STORAGE_FOLDERS, JSON.stringify(folders)); }catch(e){} }
  function persistMode(){ try{ localStorage.setItem(STORAGE_MODE, boardMode); }catch(e){} }
  function persistScenes(){ try{ localStorage.setItem(STORAGE_SCENES, JSON.stringify(scenes)); }catch(e){} }

  function defaultSize(kind){
    if(kind==='quick') return {w:190,h:150};
    if(kind==='photo') return {w:220,h:220};
    if(kind==='audio') return {w:270,h:96};
    if(kind==='link') return {w:270,h:96};
    if(kind==='folder') return {w:270,h:230};
    return {w:210,h:260};
  }

  // ---------- THEME ----------
  var sunIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></svg>';
  var moonIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1110 3.2 6.8 6.8 0 0020 14.5z"/></svg>';
  var themeToggle = document.getElementById('themeToggle');
  function applyTheme(dark){
    document.body.classList.toggle('dark', dark);
    themeToggle.innerHTML = dark ? sunIcon : moonIcon;
    themeToggle.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
  }
  function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem(STORAGE_THEME); }catch(e){}
    applyTheme(saved === 'dark');
  }
  themeToggle.addEventListener('click', function(){
    var dark = !document.body.classList.contains('dark');
    applyTheme(dark);
    try{ localStorage.setItem(STORAGE_THEME, dark ? 'dark' : 'light'); }catch(e){}
  });

  // ---------- ARRANGE TOGGLE ----------
  var arrangeToggle = document.getElementById('arrangeToggle');
  var gridIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
  var scatterIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="7" r="1.6" fill="currentColor" stroke="none"/><circle cx="17" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="13" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="5" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>';
  var zoomWrap = document.getElementById('zoomWrap');
  var scenesWrap = document.getElementById('scenesWrap');
  function updateArrangeBtn(){
    var masonry = boardMode === 'masonry';
    arrangeToggle.innerHTML = masonry ? scatterIcon : gridIcon;
    arrangeToggle.title = masonry ? 'Switch to free layout' : 'Arrange notes in a grid';
    arrangeToggle.classList.toggle('active', masonry);
    zoomWrap.hidden = masonry;
    scenesWrap.hidden = masonry;
  }
  arrangeToggle.addEventListener('click', function(){
    if(selectionMode) exitSelectionMode();
    activeCardId = null;
    boardMode = boardMode === 'masonry' ? 'free' : 'masonry';
    persistMode();
    updateArrangeBtn();
    renderBoard();

      if(!moved) return;
      edge.cx = e.clientX; edge.cy = e.clientY;
      if((isDraggable || groupDrag) && !edge.apply) edgeStart(applyDrag);
      applyDrag(e.clientX, e.clientY);
    });
    // position from where the pointer is on the board (stays right while the view auto-scrolls or the board grows)
    function applyDrag(cx, cy){
      var pl = pointerLogical(cx, cy), dx = pl.x - startPL.x, dy = pl.y - startPL.y;
      var items = [];
      if(isDraggable){
        note.x = origX + dx; note.y = origY + dy; place(note, cardEl);
        items.push({n:note, el:cardEl});
      } else if(groupDrag){
        group.forEach(function(g){
          g.n.x = g.x + dx; g.n.y = g.y + dy; place(g.n, g.el);
          items.push({n:g.n, el:g.el});
        });
      }
      clampDragged(items);
    }
    // never let what is being dragged leave the board: it can only go further once the board has grown at the edge
    function clampDragged(items){
      if(!items.length) return;
      var z = boardZoom || 1, br = board.getBoundingClientRect();
      var W = parseFloat(boardInner.style.width) || 0, H = parseFloat(boardInner.style.height) || 0;
      var l=Infinity, t=Infinity, r=-Infinity, b=-Infinity;
      items.forEach(function(it){
        var rc = it.el.getBoundingClientRect();
        l = Math.min(l, (rc.left - br.left + board.scrollLeft)/z); t = Math.min(t, (rc.top - br.top + board.scrollTop)/z);
        r = Math.max(r, (rc.right - br.left + board.scrollLeft)/z); b = Math.max(b, (rc.bottom - br.top + board.scrollTop)/z);
      });
      var sx = 0, sy = 0;
      if(r > W) sx = W - r;
      if(l + sx < 0) sx = -l;
      if(b > H) sy = H - b;
      if(t + sy < 0) sy = -t;
      if(sx || sy) items.forEach(function(it){ it.n.x += sx; it.n.y += sy; place(it.n, it.el); });
    }
    function end(){
      clearTimeout(longPressTimer);
      if(!tracking) return;
      tracking = false;
      edgeStop();   // drops any temporary edge room; layoutBoard() below trims the board to the notes
      if(isDraggable) cardEl.classList.remove('dragging');
      if(selectionMode){
        if(groupDrag && moved){ persistNotes(); layoutBoard(); }
        else if(!longPressFired && !moved) toggleSelect(note.id);
      } else if(isDraggable && moved){
        persistNotes();
        layoutBoard();
        if(activeCardId !== note.id){ activeCardId = note.id; renderBoard(); }
      } else if(!moved && !longPressFired){
        if(activeCardId === note.id){
          openEditor(note.id);               // 2nd tap: open preview/editor (a photo opens the original with a tap inside it)
        } else {
          activeCardId = note.id;            // 1st tap: select
          bringToFront(note); persistNotes();
          renderBoard();
        }
      }
      longPressFired = false; moved = false; isDraggable = false; groupDrag = false; group = null;
    }
    cardEl.addEventListener('pointerup', end);
    cardEl.addEventListener('pointercancel', function(){ clearTimeout(longPressTimer); cardEl.classList.remove('dragging'); isDraggable=false; groupDrag=false; tracking=false; edgeStop(); layoutBoard(); });
  }

  function attachResize(handleEl, cardEl, note){
    var startX, startY, startW, startH, resizing=false;
    handleEl.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      handleEl.setPointerCapture(e.pointerId);
      var rect = cardEl.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY; startW = rect.width; startH = rect.height; resizing = true;
      note.sized = true;
      note.w = startW; note.h = startH;
      cardEl.classList.remove('auto-size'); cardEl.classList.add('sized');
      cardEl.style.width = note.w + 'px';
      cardEl.style.height = note.h + 'px';
      bringToFront(note);
      cardEl.style.zIndex = note.z;
      cardEl.classList.add('resizing');
    });
    handleEl.addEventListener('pointermove', function(e){
      if(!resizing) return;
      e.stopPropagation();
      var dx = e.clientX - startX, dy = e.clientY - startY;
      note.w = clamp(startW + dx, CARD_W_MIN, CARD_W_MAX);
      note.h = clamp(startH + dy, CARD_H_MIN, CARD_H_MAX);
      cardEl.style.width = note.w + 'px';
      cardEl.style.height = note.h + 'px';
    });
    function end(e){
      if(!resizing) return;
      if(e) e.stopPropagation();
      resizing = false;
      persistNotes();
      renderBoard();
    }
    handleEl.addEventListener('pointerup', end);
    handleEl.addEventListener('pointercancel', end);
  }

  function attachRotate(handleEl, cardEl, note){
    var rotating=false, cx, cy, startAngle, startRot;
    handleEl.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      handleEl.setPointerCapture(e.pointerId);
      var rect = cardEl.getBoundingClientRect();
      cx = rect.left + rect.width/2; cy = rect.top + rect.height/2;
      startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180/Math.PI;
      startRot = note.rot;
      rotating = true;
      bringToFront(note); cardEl.style.zIndex = note.z;
      cardEl.classList.add('rotating');
    });
    handleEl.addEventListener('pointermove', function(e){
      if(!rotating) return;
      e.stopPropagation();
      var angle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180/Math.PI;
      note.rot = Math.round((startRot + (angle - startAngle) + 90) * 10) / 10;
      cardEl.style.transform = 'translate('+(note.x+offX)+'px,'+(note.y+offY)+'px) rotate('+note.rot+'deg)';
    });
    function end(e){
      if(!rotating) return;
      if(e) e.stopPropagation();
      rotating = false;
      cardEl.classList.remove('rotating');
      persistNotes();
    }
    handleEl.addEventListener('pointerup', end);
    handleEl.addEventListener('pointercancel', end);
  }

  // centre of what the user is looking at, in board (logical) coordinates.
  // In masonry mode the free view isn't on screen, so use the last saved free view.
  function viewCenterLogical(){
    var vw = board.clientWidth, vh = board.clientHeight, z, sl, st, ox, oy;
    if(boardMode === 'free'){ z = boardZoom || 1; sl = board.scrollLeft; st = board.scrollTop; ox = offX; oy = offY; }
    else if(freeView && typeof freeView.left === 'number'){
      z = clamp(freeView.zoom || 1, 0.4, 2.2); sl = freeView.left; st = freeView.top;
      ox = typeof freeView.ox === 'number' ? freeView.ox : BOARD_OFFSET;
      oy = typeof freeView.oy === 'number' ? freeView.oy : BOARD_OFFSET;
    } else return {x:0, y:0};
    return { x:(sl + vw/2)/z - ox, y:(st + vh/2)/z - oy };
  }
  function placeNewNotePosition(size){
    size = size || {w:210, h:260};
    var c = viewCenterLogical();
    // don't land exactly on top of another item: nudge diagonally while a card is already centred there
    var nudge = 0;
    if(boardMode === 'free'){
      var z = boardZoom || 1, br = board.getBoundingClientRect();
      var centers = Array.prototype.map.call(boardInner.querySelectorAll('.card[data-note-id]'), function(el){
        var r = el.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2};
      });
      for(var k=0; k<40; k++){
        var tx = br.left + board.clientWidth/2 + nudge*z, ty = br.top + board.clientHeight/2 + nudge*z;
        var clash = centers.some(function(p){ return Math.abs(p.x - tx) < 14 && Math.abs(p.y - ty) < 14; });
        if(!clash) break;
        nudge += 26;
      }
    }
    return { x:c.x - size.w/2 + nudge, y:c.y - size.h/2 + nudge, cx:c.x, cy:c.y, nudge:nudge };
  }

  // ---------- ZOOM ----------
  var ZOOM_MIN = 0.4, ZOOM_MAX = 2.2;
  var zoomBtn = document.getElementById('zoomBtn');
  var zoomSliderPop = document.getElementById('zoomSliderPop');
  var zoomSlider = document.getElementById('zoomSlider');   // custom vertical slider (div)
  var zoomThumb = document.getElementById('zoomThumb');
  var zoomTick = document.getElementById('zoomTick');
  var zoomOpen = false;
  function setZoomOpen(v){ zoomOpen=v; zoomSliderPop.hidden = !v; zoomBtn.classList.toggle('active', v); if(v) syncZoomUI(); }

  // slider is logarithmic so every step feels the same (zoom is multiplicative); top = zoom in
  function zoomToT(z){ return Math.log(z/ZOOM_MIN) / Math.log(ZOOM_MAX/ZOOM_MIN); }
  function tToZoom(t){ return ZOOM_MIN * Math.pow(ZOOM_MAX/ZOOM_MIN, t); }
  function thumbTop(t){ return 'calc(12px + (100% - 24px) * ' + (1 - t) + ')'; }
  function syncZoomUI(){
    var z = boardZoom || 1;
    document.getElementById('zoomPct').textContent = Math.round(z*100) + '%';
    zoomThumb.style.top = thumbTop(zoomToT(z));
    zoomTick.style.top = thumbTop(zoomToT(1));
    zoomSlider.setAttribute('aria-valuenow', Math.round(z*100));
  }

  // Core: set the zoom keeping board point (contentX, contentY) — in unzoomed board px — under screen point (px, py) of the board viewport.
  function zoomWithAnchor(newZoom, contentX, contentY, px, py){
    newZoom = clamp(newZoom, ZOOM_MIN, ZOOM_MAX);
    var lx = contentX - offX, ly = contentY - offY;   // logical point: survives the origin moving
    boardZoom = newZoom;
    applyZoom();
    layoutBoard();
    board.scrollLeft = (lx + offX) * newZoom - px;
    board.scrollTop = (ly + offY) * newZoom - py;
    syncZoomUI();
    trackFreeView(); // always remember the zoom, even when the scroll position doesn't change
  }
  // zoom around a client point (cursor / pinch centre)
  function setZoomAt(newZoom, clientX, clientY){
    if(boardMode !== 'free'){ boardZoom = clamp(newZoom, ZOOM_MIN, ZOOM_MAX); return; }
    var rect = board.getBoundingClientRect(), z = boardZoom || 1;
    var px = clientX - rect.left, py = clientY - rect.top;
    zoomWithAnchor(newZoom, (board.scrollLeft + px)/z, (board.scrollTop + py)/z, px, py);
  }
  // zoom around the centre of what is on screen
  function setZoomCentered(newZoom){
    var rect = board.getBoundingClientRect();
    setZoomAt(newZoom, rect.left + board.clientWidth/2, rect.top + board.clientHeight/2);
  }
  // zoom out/in so every visible note fits on screen (never above 100%)
  function fitAll(){
    if(boardMode !== 'free') return;
    var vw = board.clientWidth, vh = board.clientHeight;
    var els = boardInner.querySelectorAll('.card[data-note-id]:not(.faded)');
    if(!els.length){ zoomWithAnchor(1, offX, offY, vw/2, vh/2); return; }
    var br = board.getBoundingClientRect(), z = boardZoom || 1;
    var x1=Infinity, y1=Infinity, x2=-Infinity, y2=-Infinity;
    Array.prototype.forEach.call(els, function(el){
      var r = el.getBoundingClientRect();
      x1 = Math.min(x1, (r.left - br.left + board.scrollLeft)/z); y1 = Math.min(y1, (r.top - br.top + board.scrollTop)/z);
      x2 = Math.max(x2, (r.right - br.left + board.scrollLeft)/z); y2 = Math.max(y2, (r.bottom - br.top + board.scrollTop)/z);
    });
    var pad = 40, w = (x2 - x1) + 2*pad, h = (y2 - y1) + 2*pad;
    zoomWithAnchor(Math.min(vw/w, vh/h, 1), (x1+x2)/2, (y1+y2)/2, vw/2, vh/2);
  }

  // button now only opens/closes the panel (it used to reset the zoom to 100% on every tap)
  zoomBtn.addEventListener('click', function(){ setZoomOpen(!zoomOpen); });
  document.getElementById('zoomPct').addEventListener('click', function(){ setZoomCentered(1); });
  document.getElementById('zoomInBtn').addEventListener('click', function(){ setZoomCentered((boardZoom||1) * 1.25); });
  document.getElementById('zoomOutBtn').addEventListener('click', function(){ setZoomCentered((boardZoom||1) / 1.25); });
  document.getElementById('zoomFitBtn').addEventListener('click', fitAll);

  // custom slider: drag the thumb or tap the track; snaps to 100%
  var zoomDragging = false;
  function zoomFromPointer(e){
    var r = zoomSlider.getBoundingClientRect();
    var t = 1 - clamp((e.clientY - r.top - 12) / (r.height - 24), 0, 1);
    var z = tToZoom(t);
    if(Math.abs(z - 1) < 0.03) z = 1;
    setZoomCentered(z);
  }
  zoomSlider.addEventListener('pointerdown', function(e){
    zoomDragging = true;
    try{ zoomSlider.setPointerCapture(e.pointerId); }catch(err){}
    zoomFromPointer(e); e.preventDefault();
  });
  zoomSlider.addEventListener('pointermove', function(e){ if(zoomDragging) zoomFromPointer(e); });
  function zoomDragEnd(){ zoomDragging = false; }
  zoomSlider.addEventListener('pointerup', zoomDragEnd);
  zoomSlider.addEventListener('pointercancel', zoomDragEnd);
  zoomSlider.addEventListener('keydown', function(e){
    var z = boardZoom || 1;
    if(e.key === 'ArrowUp' || e.key === 'ArrowRight' || e.key === '+'){ setZoomCentered(z * 1.1); e.preventDefault(); }
    else if(e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === '-'){ setZoomCentered(z / 1.1); e.preventDefault(); }
    else if(e.key === '0'){ setZoomCentered(1); e.preventDefault(); }
  });
  syncZoomUI();

  document.addEventListener('pointerdown', function(e){
    if(!zoomOpen) return;
    if(zoomSliderPop.contains(e.target) || zoomBtn.contains(e.target)) return;
    setZoomOpen(false);
  });

  // Ctrl/Cmd + wheel (and trackpad pinch): zoom towards the cursor
  board.addEventListener('wheel', function(e){
    if(boardMode !== 'free') return;
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      setZoomAt((boardZoom||1) * Math.exp(-e.deltaY * 0.0025), e.clientX, e.clientY);
    }
  }, {passive:false});

  // two-finger pinch: zooms around the point between the fingers and follows them while pinching
  var activePointers = {};
  var pinch = null;
  board.addEventListener('pointerdown', function(e){ if(boardMode==='free') activePointers[e.pointerId] = {x:e.clientX,y:e.clientY}; });
  board.addEventListener('pointermove', function(e){
    if(boardMode !== 'free' || !activePointers[e.pointerId]) return;
    activePointers[e.pointerId] = {x:e.clientX,y:e.clientY};
    var ids = Object.keys(activePointers);
    if(ids.length === 2){
      var p0 = activePointers[ids[0]], p1 = activePointers[ids[1]];
      var dist = Math.hypot(p0.x-p1.x, p0.y-p1.y) || 1;
      var mx = (p0.x+p1.x)/2, my = (p0.y+p1.y)/2;

      } else {

    }
  });

  board.addEventListener('pointerup', clearPointer);
  board.addEventListener('pointercancel', clearPointer);

  // ---------- SCENES ----------
  var scenesBtn = document.getElementById('scenesBtn');
  var scenesPanel = document.getElementById('scenesPanel');
  var scenesOpen = false;
  function setScenesOpen(v){ scenesOpen=v; scenesPanel.hidden=!v; scenesBtn.classList.toggle('active', v); if(v) renderScenesPanel(); }
  scenesBtn.addEventListener('click', function(){ setScenesOpen(!scenesOpen); });
  document.addEventListener('pointerdown', function(e){
    if(!scenesOpen) return;
    if(scenesPanel.contains(e.target) || scenesBtn.contains(e.target)) return;
    setScenesOpen(false);
  });
  function renderScenesPanel(){
    var html = scenes.map(function(s){
      return '<div class="scene-row"><button class="sc-name" data-scene="'+s.id+'">'+escapeHtml(s.name)+'</button><button class="sc-del" data-scene-del="'+s.id+'">&times;</button></div>';
    }).join('');
    html += '<div class="scene-add-row"><input type="text" id="sceneNameInput" placeholder="Scene name"><button id="sceneAddBtn">+</button></div>';
    scenesPanel.innerHTML = html;
    document.getElementById('sceneAddBtn').addEventListener('click', function(){
      var input = document.getElementById('sceneNameInput');
      var name = input.value.trim() || ('Scene ' + (scenes.length+1));
      scenes.push({id:uid(), name:name, scrollLeft:board.scrollLeft, scrollTop:board.scrollTop, zoom:boardZoom, ox:offX, oy:offY});
      persistScenes(); renderScenesPanel();
    });
  }
  scenesPanel.addEventListener('click', function(e){
    var del = e.target.closest('[data-scene-del]');
    if(del){ scenes = scenes.filter(function(s){return s.id!==del.getAttribute('data-scene-del');}); persistScenes(); renderScenesPanel(); return; }
    var go = e.target.closest('[data-scene]');
    if(go){
      var s = scenes.find(function(x){return x.id===go.getAttribute('data-scene');});
      if(s){
        var sz = s.zoom || 1;
        var sox = typeof s.ox === 'number' ? s.ox : BOARD_OFFSET;
        var soy = typeof s.oy === 'number' ? s.oy : BOARD_OFFSET;
        boardZoom = sz; applyZoom(); syncZoomUI(); layoutBoard();

  // ---------- MARQUEE SELECT (mouse drag / long-press+drag on touch) ----------
  var marqueeBox = document.getElementById('marqueeBox');
  (function(){
    var startX=null, startY=null, startCX=0, startCY=0, active=false, touchHoldTimer=null, pendingTouch=false;
    function beginMarquee(clientX, clientY){
      active = true;
      startCX = clientX; startCY = clientY;
      var rect = board.getBoundingClientRect();
      var zz = boardZoom || 1;
      startX = (clientX - rect.left + board.scrollLeft) / zz;
      startY = (clientY - rect.top + board.scrollTop) / zz;
      if(!selectionMode){ selectionMode = true; selectedIds = {}; }
      marqueeBox.hidden = false;
      updateMarquee(clientX, clientY);
    }
    function updateMarquee(clientX, clientY){
      var rect = board.getBoundingClientRect();
      var zz = boardZoom || 1;
      var curX = (clientX - rect.left + board.scrollLeft) / zz;
      var curY = (clientY - rect.top + board.scrollTop) / zz;
      var x = Math.min(startX,curX), y = Math.min(startY,curY);
      var w = Math.abs(curX-startX), h = Math.abs(curY-startY);
      marqueeBox.style.left = Math.min(startCX, clientX)+'px'; marqueeBox.style.top = Math.min(startCY, clientY)+'px';
      marqueeBox.style.width = Math.abs(clientX-startCX)+'px'; marqueeBox.style.height = Math.abs(clientY-startCY)+'px';
      var boxLogical = { x1:x-offX, y1:y-offY, x2:x+w-offX, y2:y+h-offY };
      selectedIds = {};
      notes.forEach(function(n){
        if(n.x < boxLogical.x2 && n.x+n.w > boxLogical.x1 && n.y < boxLogical.y2 && n.y+n.h > boxLogical.y1){
          selectedIds[n.id] = true;
        }
      });
      renderBoard(); renderSelectionBar();
    }
    board.addEventListener('pointerdown', function(e){
      if(boardMode !== 'free') return;
      if(e.target !== board && e.target !== boardInner) return; // only empty space
      if(e.pointerType === 'mouse'){
        beginMarquee(e.clientX, e.clientY);
        board.setPointerCapture(e.pointerId);
      } else {
        pendingTouch = true;
        var sx=e.clientX, sy=e.clientY, pid=e.pointerId;
        touchHoldTimer = setTimeout(function(){
          if(pendingTouch){ beginMarquee(sx, sy); try{ board.setPointerCapture(pid); }catch(err){} }
        }, 1000);
      }
    });
    board.addEventListener('pointermove', function(e){
      if(touchHoldTimer && !active){
        clearTimeout(touchHoldTimer); pendingTouch=false;
      }
      if(!active) return;
      updateMarquee(e.clientX, e.clientY);
    });
    function endMarquee(){
      clearTimeout(touchHoldTimer); pendingTouch=false;
      if(active){ active=false; marqueeBox.hidden = true; if(Object.keys(selectedIds).length===0) exitSelectionMode(); else renderSelectionBar(); }
    }
    board.addEventListener('pointerup', endMarquee);
    board.addEventListener('pointercancel', endMarquee);
  })();

  board.addEventListener('click', function(e){
    if((e.target === board || e.target === boardInner) && activeCardId){
      activeCardId = null;

    }
  });

  // ---------- SELECTION MODE ----------

  var selFolderBtn = document.getElementById('selFolderBtn');

  // ---------- FOLDERS DROPDOWN ----------
  var foldersBtn = document.getElementById('foldersBtn');
  var foldersPanel = document.getElementById('foldersPanel');

  function setFoldersOpen(v){

  document.getElementById('drawDoneBtn').addEventListener('click', function(){
    var dataUrl = drawCanvas.toDataURL('image/png');
    drawOverlay.hidden = true;
    insertInlineImage(dataUrl);
  });

  // ---------- DELETE ----------
  function askDelete(id){
    pendingDeleteNoteId = id; pendingDeleteFolderId = null; pendingDeleteNoteIds = null;
    document.getElementById('modalTitle').textContent = 'Delete';
    document.getElementById('modalMessage').textContent = "This can't be undone. It will be permanently deleted.";
    document.getElementById('modalConfirm').textContent = 'Delete';
    showModal();
  }
  function askDeleteFolder(id){
    pendingDeleteFolderId = id; pendingDeleteNoteId = null; pendingDeleteNoteIds = null;
    var f = getFolder(id);
    document.getElementById('modalTitle').textContent = 'Delete folder';
    document.getElementById('modalMessage').textContent = 'Notes in "'+(f?f.name:'this folder')+'" will move to All. This can\'t be undone.';
    document.getElementById('modalConfirm').textContent = 'Delete folder';
    showModal();
  }
  function showModal(){ document.getElementById('modalOverlay').classList.add('show'); }
  function hideModal(){ document.getElementById('modalOverlay').classList.remove('show','blur'); pendingDeleteNoteId=null; pendingDeleteFolderId=null; pendingDeleteNoteIds=null; renderBoard(); }
  function performDelete(){
    if(pendingDeleteNoteIds){
      var gone = {}; pendingDeleteNoteIds.forEach(function(id){ gone[id] = true; });
      notes = notes.filter(function(n){ return !gone[n.id]; });
      persistNotes();
      selectionMode = false; selectedIds = {}; activeCardId = null;
      renderAll(); renderSelectionBar();
    } else if(pendingDeleteNoteId){
      notes = notes.filter(function(n){ return n.id !== pendingDeleteNoteId; });
      persistNotes();
      if(openNoteId === pendingDeleteNoteId){ forceCloseEditor(); }
      if(activeCardId === pendingDeleteNoteId) activeCardId = null;
      renderAll();
    } else if(pendingDeleteFolderId){
      var fid = pendingDeleteFolderId;
      notes.forEach(function(n){ if(n.folderId===fid) n.folderId = null; });
      folders = folders.filter(function(f){ return f.id !== fid; });
      persistNotes(); persistFolders();
      if(selectedFolder === fid) selectedFolder = 'all';
      renderAll();
    }
    hideModal();
  }
  document.getElementById('modalCancel').addEventListener('click', hideModal);
  document.getElementById('modalConfirm').addEventListener('click', performDelete);
  document.getElementById('modalOverlay').addEventListener('mousedown', function(e){ if(e.target.id==='modalOverlay') hideModal(); });

  document.addEventListener('keydown', function(e){
    var mod = e.metaKey || e.ctrlKey;
    if(mod && (e.key==='n'||e.key==='N')){ e.preventDefault(); createItem('note'); }
    else if(e.key === 'Escape'){
      if(!drawOverlay.hidden) drawOverlay.hidden = true;
      else if(folderPickOpen) setFolderPickOpen(false);
      else if(fwOpen && folderMenuOpen()) setFolderMenu(false);
      else if(fwOpen) closeEditor();
      else if(document.getElementById('modalOverlay').classList.contains('show')) hideModal();
      else if(fabMenuOpen) setFabMenu(false);
      else if(selectionMode) exitSelectionMode();
    }
  });

  function renderAll(){
    renderBoard();
    if(foldersOpen) renderFoldersPanel();
  }

  // ---------- INIT ----------
  initTheme();
  loadNotesAsync().then(function(list){
    notes = list || [];
    loadState();
    stateLoaded = true;
    if(notesFromLegacy) persistNotes();
    updateArrangeBtn();
    renderAll();
  });
})();
</script>
</body>
</html>
