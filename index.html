      <button class="etb-btn" id="lockBtn" title="Fix in place">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      </button>
      <button class="etb-btn" id="pinBtn" title="Pin note">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M8 3h8l-1 6 3 3v2H6v-2l3-3-1-6z"/></svg>
      </button>
      <div class="etb-flex-spacer"></div>
      <span class="save-indicator" id="saveIndicator" style="font-size:11px; opacity:0;">Saved</span>
    </div>
  </div>

  <!-- FULL PHOTO VIEWER -->
  <div class="photo-viewer" id="photoViewer" hidden>
    <button class="photo-viewer-close" id="photoViewerClose" title="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="photo-viewer-stage" id="photoViewerStage">
      <img id="photoViewerImg" src="" alt="" draggable="false">
    </div>
  </div>

  <!-- DRAWING OVERLAY -->
  <div class="draw-overlay" id="drawOverlay" hidden>
    <div class="draw-topbar">
      <button id="drawCancelBtn">Cancel</button>
      <div class="draw-colors" id="drawColors"></div>
      <div class="draw-spacer"></div>
      <button id="drawClearBtn">Clear</button>
      <button id="drawDoneBtn" style="font-weight:600;">Done</button>
    </div>
    <canvas id="drawCanvas"></canvas>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- CONFIRM MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3 id="modalTitle">Delete note</h3>
      <p id="modalMessage">This can't be undone. The note will be permanently deleted.</p>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modalCancel">Cancel</button>
        <button class="modal-btn confirm" id="modalConfirm">Delete</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var STORAGE_NOTES = 'notepad_notes_v3';
  var STORAGE_FOLDERS = 'notepad_folders_v1';
  var STORAGE_THEME = 'notepad_theme_v1';
  var STORAGE_MODE = 'notepad_mode_v1';
  var STORAGE_SCENES = 'notepad_scenes_v1';
  var COLORS = ['paper','pink','lime','sky','dark'];
  var CARD_W_MIN=140, CARD_W_MAX=460, CARD_H_MIN=110, CARD_H_MAX=460;
  var BOARD_OFFSET = 3000;

  var notes = [];
  var folders = [];
  var scenes = [];
  var selectedFolder = 'all';
  var openNoteId = null;
  var zTop = 10;
  var saveTimer = null;
  var pendingDeleteNoteId = null;
  var pendingDeleteFolderId = null;
  var boardMode = 'free';
  var boardZoom = 1;
  var selectionMode = false;
  var activeCardId = null;
  var selectedIds = {};

  var mediaRecorder = null, recordedChunks = [], recordStartTime = 0, recordTimerInterval = null;
  var currentAudioEl = null, currentAudioNoteId = null;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  // ---------- PERSISTENCE ----------
  function migrateFromOlder(){
    if(notes.length) return;
    ['notepad_notes_v2','notepad_notes_v1'].forEach(function(key){
      if(notes.length) return;
      try{
        var legacy = JSON.parse(localStorage.getItem(key) || '[]');
        if(legacy.length) notes = legacy.map(function(n){ n.kind = n.kind || 'note'; return n; });
      }catch(e){}
    });
  }

  function loadState(){
    try{ folders = JSON.parse(localStorage.getItem(STORAGE_FOLDERS) || '[]'); }catch(e){ folders = []; }
    try{ scenes = JSON.parse(localStorage.getItem(STORAGE_SCENES) || '[]'); }catch(e){ scenes = []; }
    try{ boardMode = localStorage.getItem(STORAGE_MODE) || 'free'; }catch(e){ boardMode = 'free'; }
    var col = 0, row = 0;
    notes.forEach(function(n){
      if(!n.kind) n.kind = 'note';
      if(typeof n.x !== 'number'){ n.x = (col%5)*236 - 470; n.y = row*210 - 210; col++; if(col>4){col=0; row++;} }
      if(typeof n.rot !== 'number') n.rot = Math.round((Math.random()*6-3)*10)/10;
      if(!n.color) n.color = 'paper';
      if(typeof n.w !== 'number') n.w = defaultSize(n.kind).w;
      if(typeof n.h !== 'number') n.h = defaultSize(n.kind).h;
      if(typeof n.sized !== 'boolean') n.sized = false;
      if(typeof n.locked !== 'boolean') n.locked = false;
      if(typeof n.grouped !== 'boolean') n.grouped = false;
      if(typeof n.image === 'undefined') n.image = null;
      if(typeof n.audio === 'undefined') n.audio = null;
      if(typeof n.url === 'undefined') n.url = null;
      if(typeof n.title === 'undefined') n.title = '';
      if(typeof n.body === 'undefined') n.body = '';
      if(typeof n.z !== 'number') n.z = ++zTop; else if(n.z > zTop) zTop = n.z;
      if(n.kind === 'note'){
        if(n.image && (n.body||'').indexOf(n.image) === -1){ n.body = '<img src="'+n.image+'">' + (n.body||''); n.image = null; }
        if(n.audio && (n.body||'').indexOf(n.audio) === -1){ n.body = (n.body||'') + '<span contenteditable="false"><audio controls src="'+n.audio+'"></audio></span>'; n.audio = null; }
      }
    });
  }
  // ---- Notes live in IndexedDB (localStorage is ~5MB and silently fails once photos fill it) ----
  var IDB = (function(){
    var dbp = null;
    function open(){
      if(dbp) return dbp;
      dbp = new Promise(function(res, rej){
        if(!window.indexedDB){ rej(new Error('no idb')); return; }
        var r = indexedDB.open('notepad_db', 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      });
      return dbp;
    }
    function get(k){
      return open().then(function(db){ return new Promise(function(res, rej){
        var q = db.transaction('kv','readonly').objectStore('kv').get(k);
        q.onsuccess = function(){ res(q.result); }; q.onerror = function(){ rej(q.error); };
      }); });
    }
    function set(k, v){
      return open().then(function(db){ return new Promise(function(res, rej){
        var tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
        tx.onabort = function(){ rej(tx.error); };
      }); });
    }
    return { get:get, set:set };
  })();

  var stateLoaded = false, writing = false, writePending = false, notesFromLegacy = false, toastTimer = null;

  function showToast(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, 4500);
  }
  function clearLegacyNotes(){
    try{ ['notepad_notes_v3','notepad_notes_v2','notepad_notes_v1'].forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  }
  function loadNotesAsync(){
    return IDB.get('notes').catch(function(){ return undefined; }).then(function(v){
      if(Array.isArray(v)) return v;
      var legacy = [];
      ['notepad_notes_v3','notepad_notes_v2','notepad_notes_v1'].forEach(function(key){
        if(legacy.length) return;
        try{ var l = JSON.parse(localStorage.getItem(key) || '[]'); if(l.length) legacy = l; }catch(e){}
      });
      notesFromLegacy = legacy.length > 0;
      return legacy;
    });
  }
  function persistNotes(){
    if(!stateLoaded) return;
    if(writing){ writePending = true; return; }
    writing = true;
    IDB.set('notes', notes).then(function(){ clearLegacyNotes(); }).catch(function(){
      try{ localStorage.setItem(STORAGE_NOTES, JSON.stringify(notes)); }
      catch(e){ showToast("Couldn't save — this device's storage is full."); }
    }).then(function(){
      writing = false;
      if(writePending){ writePending = false; persistNotes(); }
    });
  }
  function flushSave(){ clearTimeout(saveTimer); persistNotes(); }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') flushSave(); });
  window.addEventListener('pagehide', flushSave);
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  function persistFolders(){ try{ localStorage.setItem(STORAGE_FOLDERS, JSON.stringify(folders)); }catch(e){} }
  function persistMode(){ try{ localStorage.setItem(STORAGE_MODE, boardMode); }catch(e){} }
  function persistScenes(){ try{ localStorage.setItem(STORAGE_SCENES, JSON.stringify(scenes)); }catch(e){} }

  function defaultSize(kind){
    if(kind==='quick') return {w:190,h:150};
    if(kind==='photo') return {w:220,h:220};
    if(kind==='audio') return {w:206,h:130};
    if(kind==='link') return {w:206,h:120};
    return {w:210,h:260};
  }

  // ---------- THEME ----------
  var sunIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></svg>';
  var moonIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1110 3.2 6.8 6.8 0 0020 14.5z"/></svg>';
  var themeToggle = document.getElementById('themeToggle');
  function applyTheme(dark){
    document.body.classList.toggle('dark', dark);
    themeToggle.innerHTML = dark ? sunIcon : moonIcon;
    themeToggle.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
  }
  function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem(STORAGE_THEME); }catch(e){}
    applyTheme(saved === 'dark');
  }
  themeToggle.addEventListener('click', function(){
    var dark = !document.body.classList.contains('dark');
    applyTheme(dark);
    try{ localStorage.setItem(STORAGE_THEME, dark ? 'dark' : 'light'); }catch(e){}
  });

  // ---------- ARRANGE TOGGLE ----------
  var arrangeToggle = document.getElementById('arrangeToggle');
  var gridIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
  var scatterIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="7" r="1.6" fill="currentColor" stroke="none"/><circle cx="17" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="13" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="5" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>';
  var zoomWrap = document.getElementById('zoomWrap');
  var scenesWrap = document.getElementById('scenesWrap');
  function updateArrangeBtn(){
    var masonry = boardMode === 'masonry';
    arrangeToggle.innerHTML = masonry ? scatterIcon : gridIcon;
    arrangeToggle.title = masonry ? 'Switch to free layout' : 'Arrange notes in a grid';
    arrangeToggle.classList.toggle('active', masonry);
    zoomWrap.hidden = masonry;
    scenesWrap.hidden = masonry;
  }
  arrangeToggle.addEventListener('click', function(){
    if(selectionMode) exitSelectionMode();
    activeCardId = null;
    boardMode = boardMode === 'masonry' ? 'free' : 'masonry';
    persistMode();
    updateArrangeBtn();
    renderBoard();
  });

  // ---------- HELPERS ----------
  function plainText(html){ var d=document.createElement('div'); d.innerHTML = html||''; return d.textContent || ''; }
  function htmlToTextPreserveBreaks(html){
    var d = document.createElement('div');
    d.innerHTML = html || '';
    var blockTags = ['DIV','P','BR','LI','H1','H2','H3','UL','OL'];
    var out = '';
    function walk(node){
      if(node.nodeType === 3){ out += node.nodeValue; return; }
      if(node.nodeType !== 1) return;
      if(node.tagName === 'AUDIO' || node.tagName === 'IMG') return;
      Array.prototype.forEach.call(node.childNodes, walk);
      if(blockTags.indexOf(node.tagName) !== -1) out += '\n';
    }
    Array.prototype.forEach.call(d.childNodes, walk);
    return out.replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g,'\n').trim();
  }
  function extractFirstImageSrc(html){
    var d = document.createElement('div'); d.innerHTML = html || '';
    var img = d.querySelector('img');
    return img ? img.getAttribute('src') : null;
  }
  function bodyHasAudio(html){
    var d = document.createElement('div'); d.innerHTML = html || '';
    return !!d.querySelector('audio');
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function getNote(id){ for(var i=0;i<notes.length;i++) if(notes[i].id===id) return notes[i]; return null; }
  function getFolder(id){ for(var i=0;i<folders.length;i++) if(folders[i].id===id) return folders[i]; return null; }
  function domainFromUrl(url){
    try{ var u = new URL(url); return u.hostname.replace(/^www\./,''); }catch(e){ return url; }
  }

  function shortDate(ts){
    if(!ts) return '';
    var d = new Date(ts), now = new Date();
    var diffDays = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
    if(diffDays === 0) return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    if(diffDays === 1) return 'Yesterday';
    if(diffDays > 1 && diffDays < 7) return d.toLocaleDateString(undefined,{weekday:'long'});
    var sameYear = d.getFullYear() === now.getFullYear();
    return d.toLocaleDateString(undefined, sameYear?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'2-digit'});
  }
  var pinSvg = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M8 3h8l-1 6 3 3v2H6v-2l3-3-1-6z"/></svg>';
  var lockSvgSmall = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>';
  var audioBadgeSvg = '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3.5 3.5 0 003.5-3.5v-5a3.5 3.5 0 00-7 0v5A3.5 3.5 0 0012 15z"/><path d="M18.5 11.5a1 1 0 00-2 0 4.5 4.5 0 01-9 0 1 1 0 00-2 0 6.5 6.5 0 005.5 6.42V20h-2a1 1 0 000 2h6a1 1 0 000-2h-2v-2.08a6.5 6.5 0 005.5-6.42z"/></svg>';
  var micIconBig = '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3.5 3.5 0 003.5-3.5v-5a3.5 3.5 0 00-7 0v5A3.5 3.5 0 0012 15z"/><path d="M18.5 11.5a1 1 0 00-2 0 4.5 4.5 0 01-9 0 1 1 0 00-2 0 6.5 6.5 0 005.5 6.42V20h-2a1 1 0 000 2h6a1 1 0 000-2h-2v-2.08a6.5 6.5 0 005.5-6.42z"/></svg>';
  var pauseIconBig = '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>';
  var linkIconSmall = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1.5-1.5"/></svg>';

  function matchesFilter(n){
    if(selectedFolder!=='all' && n.folderId !== selectedFolder) return false;
    return true;
  }
  function visibleNotesOrdered(){
    return notes.filter(matchesFilter);
  }

  // ---------- BOARD RENDER ----------
  var boardInner = document.getElementById('boardInner');
  var board = document.getElementById('board');
  var emptyCanvas = document.getElementById('emptyCanvas');
  var initialScrollDone = false;

  function centerBoardScroll(){
    board.scrollLeft = BOARD_OFFSET - board.clientWidth/2;
    board.scrollTop = BOARD_OFFSET - board.clientHeight/2;
  }

  function applyZoom(){
    if(boardMode === 'free'){ boardInner.style.zoom = boardZoom; }
    else { boardInner.style.zoom = ''; }
  }
  function setZoomCentered(newZoom){
    newZoom = clamp(newZoom, 0.4, 2.2);
    if(boardMode !== 'free') { boardZoom = newZoom; return; }
    var vw = board.clientWidth, vh = board.clientHeight;
    var oldZoom = boardZoom || 1;
    var contentX = (board.scrollLeft + vw/2) / oldZoom;
    var contentY = (board.scrollTop + vh/2) / oldZoom;
    boardZoom = newZoom;
    applyZoom();
    board.scrollLeft = contentX * newZoom - vw/2;
    board.scrollTop = contentY * newZoom - vh/2;
    zoomSlider.value = Math.round(boardZoom*100);
    document.getElementById('zoomPct').textContent = Math.round(boardZoom*100) + '%';
  }

  function cardBodyHTML(n){
    if(n.kind === 'audio'){
      var label = (n.title||'').trim();
      var iconHtml = n.audio
        ? '<button class="audio-play-btn" data-audio-id="'+n.id+'">'+micIconBig+'</button>'
        : '<span class="audio-icon">'+micIconBig+'</span>';
      return '<div class="card-body"><div class="audio-row">'+iconHtml+'<span class="audio-label'+(label?'':' untitled')+'">'+(label?escapeHtml(label):'Audio note')+'</span></div>'+
        '<div class="card-footer"><span></span><span class="card-badges">'+(n.locked&&boardMode==='free'?lockSvgSmall:'')+(n.pinned?pinSvg:'')+'</span></div></div>';
    }
    if(n.kind === 'link'){
      var lt = (n.title||'').trim() || domainFromUrl(n.url||'');
      return '<div class="card-body"><div class="link-row"><span class="link-icon">'+linkIconSmall+'</span><div style="min-width:0;overflow:hidden;"><div class="link-domain">'+escapeHtml(lt)+'</div><div class="link-url">'+escapeHtml(n.url||'')+'</div></div></div>'+
        '<div class="card-footer"><span></span><span class="card-badges">'+(n.locked&&boardMode==='free'?lockSvgSmall:'')+(n.pinned?pinSvg:'')+'</span></div></div>';
    }
    if(n.kind === 'quick'){
      var text = htmlToTextPreserveBreaks(n.body);
      return '<div class="card-body"><div class="quick-text'+(text?'':' untitled')+'">'+(text?escapeHtml(text):'Empty reminder')+'</div>'+
        '<div class="card-footer"><span></span><span class="card-badges">'+(n.locked&&boardMode==='free'?lockSvgSmall:'')+(n.pinned?pinSvg:'')+'</span></div></div>';
    }
    var title = (n.title||'').trim();
    var cover = extractFirstImageSrc(n.body);
    var hasAudio = bodyHasAudio(n.body);
    var snippet = htmlToTextPreserveBreaks(n.body);
    var badges = (n.locked&&boardMode==='free'?lockSvgSmall:'') + (n.pinned?pinSvg:'') + (hasAudio?audioBadgeSvg:'');
    return (cover ? '<div class="card-img" style="background-image:url(\''+cover+'\')"></div>' : '') +
      '<div class="card-body">' +
        '<div class="card-title'+(title?'':' untitled')+'">'+(title?escapeHtml(title):'Untitled note')+'</div>'+
        '<div class="card-snippet">'+escapeHtml(snippet)+'</div>'+
        '<div class="card-footer"><span></span><span class="card-badges">'+badges+'</span></div>'+
      '</div>';
  }

  function photoInnerHTML(n){
    var badges = (n.locked&&boardMode==='free'?lockSvgSmall:'') + (n.pinned?pinSvg:'');
    var caption = (n.title||'').trim();
    return '<div class="card-photo-fill"><img src="'+n.image+'" alt="">'+
      (caption?'<div class="card-photo-caption">'+escapeHtml(caption)+'</div>':'')+
      '<div class="card-photo-footer"><span></span><span class="card-badges">'+badges+'</span></div></div>';
  }

  function renderBoard(){
    boardInner.className = 'board-inner ' + (boardMode==='masonry' ? 'mode-masonry' : 'mode-free');
    boardInner.innerHTML = '';
    board.style.overflowX = boardMode==='masonry' ? 'hidden' : 'auto';

    var list = boardMode === 'masonry' ? visibleNotesOrdered() : notes;
    masonryCards = [];

    list.forEach(function(n, idx){
      if(boardMode === 'masonry' && !matchesFilter(n)) return;
      var natural = boardMode === 'masonry' || !n.sized;
      var card = document.createElement('div');
      card.setAttribute('data-note-id', n.id);
      var cls = 'card kind-' + n.kind + ' color-' + n.color + (natural ? ' auto-size' : ' sized') + (matchesFilter(n) ? '' : ' faded');
      if(boardMode==='free' && selectionMode){ cls += selectedIds[n.id] ? ' selected' : ' select-dim'; }
      card.className = cls;

      var innerHTML = n.kind === 'photo' ? photoInnerHTML(n) : cardBodyHTML(n);
      var clip = document.createElement('div');
      clip.className = 'card-clip';
      clip.innerHTML = boardMode === 'masonry'
        ? '<div class="card-swipe-wrap"><div class="card-delete-reveal">Delete</div><div class="card-inner">'+innerHTML+'</div></div>'
        : innerHTML;
      card.appendChild(clip);

      function addDeleteBadge(){
        var deleteBadge = document.createElement('button');
        deleteBadge.className = 'delete-badge';
        deleteBadge.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        deleteBadge.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
        deleteBadge.addEventListener('click', function(e){ e.stopPropagation(); askDelete(n.id); });
        card.appendChild(deleteBadge);
      }

      if(boardMode === 'free'){
        card.style.transform = 'translate('+(n.x+BOARD_OFFSET)+'px,'+(n.y+BOARD_OFFSET)+'px) rotate('+n.rot+'deg)';
        card.style.width = n.w + 'px';
        card.style.height = n.sized ? (n.h + 'px') : 'auto';
        card.style.zIndex = n.z;
        if(activeCardId === n.id && !selectionMode){
          card.classList.add('card-active');
          addDeleteBadge();
          if(!n.locked){
            var handle = document.createElement('div');
            handle.className = 'resize-handle';
            handle.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="21" y1="15" x2="15" y2="21"/><line x1="21" y1="9" x2="9" y2="21"/></svg>';
            card.appendChild(handle);
            attachResize(handle, card, n);

            var rotHandle = document.createElement('button');
            rotHandle.className = 'rotate-handle';
            rotHandle.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>';
            card.appendChild(rotHandle);
            attachRotate(rotHandle, card, n);
          }
        }
        attachDrag(card, n);
      } else {
        card.style.animationDelay = Math.min(idx*16,180)+'ms';
        attachMasonryDrag(card, n);
      }
      wireAudioPlayButton(card, n);
      wireLinkOpen(card, n);
      if(boardMode === 'masonry') masonryCards.push(card); else boardInner.appendChild(card);
    });

    if(boardMode === 'masonry') buildMasonry();
    if(openNoteId) hideSourceCard(openNoteId);
    applyZoom();
    emptyCanvas.hidden = notes.length !== 0;

    if(!initialScrollDone && boardMode === 'free'){
      initialScrollDone = true;
      requestAnimationFrame(centerBoardScroll);
    }
  }

  function wireLinkOpen(card, n){
    if(n.kind !== 'link') return;
    // clicking the card opens the editor as usual; nothing special needed here
  }

  function wireAudioPlayButton(card, n){
    var btn = card.querySelector('.audio-play-btn');
    if(!btn) return;
    ['pointerdown','pointerup','click'].forEach(function(evt){
      btn.addEventListener(evt, function(e){ e.stopPropagation(); });
    });
    btn.addEventListener('click', function(){ toggleAudioPlay(n, btn); });
  }
  function setPlayIcon(btn, playing){
    btn.innerHTML = playing ? pauseIconBig : micIconBig;
    btn.classList.toggle('playing', playing);
  }
  function toggleAudioPlay(note, btn){
    if(currentAudioEl && currentAudioNoteId === note.id && !currentAudioEl.paused){
      currentAudioEl.pause();
      setPlayIcon(btn, false);
      return;
    }
    if(currentAudioEl){
      currentAudioEl.pause();
      var prevBtn = document.querySelector('.audio-play-btn[data-audio-id="'+currentAudioNoteId+'"]');
      if(prevBtn) setPlayIcon(prevBtn, false);
    }
    currentAudioEl = new Audio(note.audio);
    currentAudioNoteId = note.id;
    currentAudioEl.play().catch(function(){});
    setPlayIcon(btn, true);
    currentAudioEl.onended = function(){
      var el = document.querySelector('.audio-play-btn[data-audio-id="'+note.id+'"]');
      if(el) setPlayIcon(el, false);
    };
  }

  function bringToFront(n){ n.z = ++zTop; }

  // ---------- MASONRY: click to open, drag onto another card to reorder, swipe left to delete ----------
  var masonryCards = [];
  var masonryCols = 0;
  var relayoutTimer = null;
  function masonryColCount(){ return board.clientWidth < 700 ? 2 : 4; }
  function buildMasonry(){
    masonryCols = masonryColCount();
    boardInner.innerHTML = '';
    var cols = [];
    for(var i=0;i<masonryCols;i++){
      var c = document.createElement('div'); c.className = 'masonry-col';
      boardInner.appendChild(c); cols.push(c);
    }
    masonryCards.forEach(function(card){
      var target = cols[0], best = Infinity;
      cols.forEach(function(c){ var h = c.offsetHeight; if(h < best - 0.5){ best = h; target = c; } });
      target.appendChild(card);
      Array.prototype.forEach.call(card.querySelectorAll('img'), function(img){
        if(!img.complete) img.addEventListener('load', scheduleRelayout, {once:true});
      });
    });
  }
  function scheduleRelayout(){
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(function(){ if(boardMode === 'masonry') buildMasonry(); }, 60);
  }
  window.addEventListener('resize', function(){
    if(boardMode === 'masonry' && masonryColCount() !== masonryCols) scheduleRelayout();
  });

  function hideSourceCard(id){
    Array.prototype.forEach.call(boardInner.querySelectorAll('.card[data-note-id]'), function(el){
      el.style.visibility = el.getAttribute('data-note-id') === id ? 'hidden' : '';
    });
  }

  function attachMasonryDrag(cardEl, note){
    var inner = cardEl.querySelector('.card-inner');
    var reveal = cardEl.querySelector('.card-delete-reveal');
    var startX=0, startY=0, tracking=false, swiping=false, pid=null;
    cardEl.addEventListener('pointerdown', function(e){
      if(e.button !== undefined && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY; tracking = true; swiping = false; pid = e.pointerId;
    });
    cardEl.addEventListener('pointermove', function(e){
      if(!tracking) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if(!swiping){
        if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ tracking = false; return; }
        if(dx < -8 && Math.abs(dx) > Math.abs(dy)){
          swiping = true;
          try{ cardEl.setPointerCapture(pid); }catch(err){}
          reveal.style.opacity = '1';
        } else return;
      }
      inner.style.transform = 'translateX(' + Math.min(0, dx) + 'px)';
    });
    function reset(){
      inner.style.transition = 'transform 0.18s ease';
      inner.style.transform = 'translateX(0)';
      setTimeout(function(){ inner.style.transition = ''; reveal.style.opacity = '0'; }, 200);
    }
    cardEl.addEventListener('pointerup', function(e){
      if(!tracking) return;
      tracking = false;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if(swiping){
        swiping = false;
        if(dx < -Math.min(90, cardEl.offsetWidth * 0.4)){
          inner.style.transition = 'transform 0.16s ease';
          inner.style.transform = 'translateX(-100%)';
          setTimeout(function(){ askDelete(note.id); }, 170);
        } else reset();
        return;
      }
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) openEditor(note.id);
    });
    cardEl.addEventListener('pointercancel', function(){
      tracking = false;
      if(swiping){ swiping = false; reset(); }
    });
  }

  function attachDrag(cardEl, note){
    var startX, startY, origX, origY, moved=false, isDraggable=false, longPressTimer=null, longPressFired=false;
    cardEl.addEventListener('pointerdown', function(e){
      if(e.button !== undefined && e.button !== 0) return;
      cardEl.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY; origX = note.x; origY = note.y; moved = false; longPressFired = false;
      isDraggable = !selectionMode && !note.locked;
      if(isDraggable){ bringToFront(note); cardEl.style.zIndex = note.z; cardEl.classList.add('dragging'); }
      if(!selectionMode){
        longPressTimer = setTimeout(function(){
          longPressFired = true;
          if(isDraggable){ isDraggable = false; cardEl.classList.remove('dragging'); }
          enterSelectionMode(note.id);
        }, 480);
      }
    });
    cardEl.addEventListener('pointermove', function(e){
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if(!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
        moved = true;
        clearTimeout(longPressTimer);
      }
      if(isDraggable && moved){
        note.x = origX + dx;
        note.y = origY + dy;
        cardEl.style.transform = 'translate('+(note.x+BOARD_OFFSET)+'px,'+(note.y+BOARD_OFFSET)+'px) rotate('+note.rot+'deg)';
      }
    });
    function end(){
      clearTimeout(longPressTimer);
      if(isDraggable) cardEl.classList.remove('dragging');
      if(selectionMode){
        if(!longPressFired && !moved) toggleSelect(note.id);
      } else if(isDraggable && moved){
        persistNotes();
        if(activeCardId !== note.id){ activeCardId = note.id; renderBoard(); }
      } else if(!moved && !longPressFired){
        activeCardId = note.id;
        openEditor(note.id);
      }
      longPressFired = false; moved = false; isDraggable = false;
    }
    cardEl.addEventListener('pointerup', end);
    cardEl.addEventListener('pointercancel', function(){ clearTimeout(longPressTimer); cardEl.classList.remove('dragging'); isDraggable=false; });
  }

  function attachResize(handleEl, cardEl, note){
    var startX, startY, startW, startH, resizing=false;
    handleEl.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      handleEl.setPointerCapture(e.pointerId);
      var rect = cardEl.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY; startW = rect.width; startH = rect.height; resizing = true;
      note.sized = true;
      note.w = startW; note.h = startH;
      cardEl.classList.remove('auto-size'); cardEl.classList.add('sized');
      cardEl.style.width = note.w + 'px';
      cardEl.style.height = note.h + 'px';
      bringToFront(note);
      cardEl.style.zIndex = note.z;
      cardEl.classList.add('resizing');
    });
    handleEl.addEventListener('pointermove', function(e){
      if(!resizing) return;
      e.stopPropagation();
      var dx = e.clientX - startX, dy = e.clientY - startY;
      note.w = clamp(startW + dx, CARD_W_MIN, CARD_W_MAX);
      note.h = clamp(startH + dy, CARD_H_MIN, CARD_H_MAX);
      cardEl.style.width = note.w + 'px';
      cardEl.style.height = note.h + 'px';
    });
    function end(e){
      if(!resizing) return;
      if(e) e.stopPropagation();
      resizing = false;
      persistNotes();
      renderBoard();
    }
    handleEl.addEventListener('pointerup', end);
    handleEl.addEventListener('pointercancel', end);
  }

  function attachRotate(handleEl, cardEl, note){
    var rotating=false, cx, cy, startAngle, startRot;
    handleEl.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      handleEl.setPointerCapture(e.pointerId);
      var rect = cardEl.getBoundingClientRect();
      cx = rect.left + rect.width/2; cy = rect.top + rect.height/2;
      startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180/Math.PI;
      startRot = note.rot;
      rotating = true;
      bringToFront(note); cardEl.style.zIndex = note.z;
      cardEl.classList.add('rotating');
    });
    handleEl.addEventListener('pointermove', function(e){
      if(!rotating) return;
      e.stopPropagation();
      var angle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180/Math.PI;
      note.rot = Math.round((startRot + (angle - startAngle) + 90) * 10) / 10;
      cardEl.style.transform = 'translate('+(note.x+BOARD_OFFSET)+'px,'+(note.y+BOARD_OFFSET)+'px) rotate('+note.rot+'deg)';
    });
    function end(e){
      if(!rotating) return;
      if(e) e.stopPropagation();
      rotating = false;
      cardEl.classList.remove('rotating');
      persistNotes();
    }
    handleEl.addEventListener('pointerup', end);
    handleEl.addEventListener('pointercancel', end);
  }

  function placeNewNotePosition(){
    var vw = board.clientWidth, vh = board.clientHeight;
    var logicalScrollLeft = board.scrollLeft - BOARD_OFFSET;
    var logicalScrollTop = board.scrollTop - BOARD_OFFSET;
    var n = notes.length;
    var jitterX = (n * 34) % 160;
    var jitterY = (n * 27) % 120;
    return { x: logicalScrollLeft + vw/2 - 100 + jitterX, y: logicalScrollTop + vh/2 - 120 + jitterY };
  }

  // ---------- ZOOM ----------
  var zoomBtn = document.getElementById('zoomBtn');
  var zoomSliderPop = document.getElementById('zoomSliderPop');
  var zoomSlider = document.getElementById('zoomSlider');
  var zoomOpen = false;
  function setZoomOpen(v){ zoomOpen=v; zoomSliderPop.hidden = !v; zoomBtn.classList.toggle('active', v); }
  zoomBtn.addEventListener('click', function(){
    setZoomCentered(1);
    setZoomOpen(!zoomOpen);
  });
  zoomSlider.addEventListener('input', function(){ setZoomCentered(Number(zoomSlider.value)/100); });
  document.addEventListener('pointerdown', function(e){
    if(!zoomOpen) return;
    if(zoomSliderPop.contains(e.target) || zoomBtn.contains(e.target)) return;
    setZoomOpen(false);
  });

  board.addEventListener('wheel', function(e){
    if(boardMode !== 'free') return;
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      setZoomCentered(boardZoom - e.deltaY * 0.0025);
    }
  }, {passive:false});

  var activePointers = {};
  var pinchStartDist = null, pinchStartZoom = 1;
  board.addEventListener('pointerdown', function(e){ if(boardMode==='free') activePointers[e.pointerId] = {x:e.clientX,y:e.clientY}; });
  board.addEventListener('pointermove', function(e){
    if(boardMode !== 'free' || !activePointers[e.pointerId]) return;
    activePointers[e.pointerId] = {x:e.clientX,y:e.clientY};
    var ids = Object.keys(activePointers);
    if(ids.length === 2){
      var p0 = activePointers[ids[0]], p1 = activePointers[ids[1]];
      var dist = Math.hypot(p0.x-p1.x, p0.y-p1.y);
      if(pinchStartDist === null){ pinchStartDist = dist; pinchStartZoom = boardZoom; }
      else { setZoomCentered(pinchStartZoom * (dist/pinchStartDist)); }
    }
  });
  function clearPointer(e){ delete activePointers[e.pointerId]; if(Object.keys(activePointers).length < 2) pinchStartDist = null; }
  board.addEventListener('pointerup', clearPointer);
  board.addEventListener('pointercancel', clearPointer);

  // ---------- SCENES ----------
  var scenesBtn = document.getElementById('scenesBtn');
  var scenesPanel = document.getElementById('scenesPanel');
  var scenesOpen = false;
  function setScenesOpen(v){ scenesOpen=v; scenesPanel.hidden=!v; scenesBtn.classList.toggle('active', v); if(v) renderScenesPanel(); }
  scenesBtn.addEventListener('click', function(){ setScenesOpen(!scenesOpen); });
  document.addEventListener('pointerdown', function(e){
    if(!scenesOpen) return;
    if(scenesPanel.contains(e.target) || scenesBtn.contains(e.target)) return;
    setScenesOpen(false);
  });
  function renderScenesPanel(){
    var html = scenes.map(function(s){
      return '<div class="scene-row"><button class="sc-name" data-scene="'+s.id+'">'+escapeHtml(s.name)+'</button><button class="sc-del" data-scene-del="'+s.id+'">&times;</button></div>';
    }).join('');
    html += '<div class="scene-add-row"><input type="text" id="sceneNameInput" placeholder="Scene name"><button id="sceneAddBtn">+</button></div>';
    scenesPanel.innerHTML = html;
    document.getElementById('sceneAddBtn').addEventListener('click', function(){
      var input = document.getElementById('sceneNameInput');
      var name = input.value.trim() || ('Scene ' + (scenes.length+1));
      scenes.push({id:uid(), name:name, scrollLeft:board.scrollLeft, scrollTop:board.scrollTop, zoom:boardZoom});
      persistScenes(); renderScenesPanel();
    });
  }
  scenesPanel.addEventListener('click', function(e){
    var del = e.target.closest('[data-scene-del]');
    if(del){ scenes = scenes.filter(function(s){return s.id!==del.getAttribute('data-scene-del');}); persistScenes(); renderScenesPanel(); return; }
    var go = e.target.closest('[data-scene]');
    if(go){
      var s = scenes.find(function(x){return x.id===go.getAttribute('data-scene');});
      if(s){ board.scrollLeft=s.scrollLeft; board.scrollTop=s.scrollTop; boardZoom=s.zoom||1; zoomSlider.value=Math.round(boardZoom*100); document.getElementById('zoomPct').textContent=Math.round(boardZoom*100)+'%'; applyZoom(); }
      setScenesOpen(false);
    }
  });

  // ---------- MARQUEE SELECT (mouse drag / long-press+drag on touch) ----------
  var marqueeBox = document.getElementById('marqueeBox');
  (function(){
    var startX=null, startY=null, active=false, touchHoldTimer=null, pendingTouch=false;
    function beginMarquee(clientX, clientY){
      active = true;
      var rect = board.getBoundingClientRect();
      startX = clientX - rect.left + board.scrollLeft;
      startY = clientY - rect.top + board.scrollTop;
      if(!selectionMode){ selectionMode = true; selectedIds = {}; }
      marqueeBox.hidden = false;
      updateMarquee(clientX, clientY);
    }
    function updateMarquee(clientX, clientY){
      var rect = board.getBoundingClientRect();
      var curX = clientX - rect.left + board.scrollLeft;
      var curY = clientY - rect.top + board.scrollTop;
      var x = Math.min(startX,curX), y = Math.min(startY,curY);
      var w = Math.abs(curX-startX), h = Math.abs(curY-startY);
      marqueeBox.style.left = x+'px'; marqueeBox.style.top = y+'px';
      marqueeBox.style.width = w+'px'; marqueeBox.style.height = h+'px';
      var boxLogical = { x1:x-BOARD_OFFSET, y1:y-BOARD_OFFSET, x2:x+w-BOARD_OFFSET, y2:y+h-BOARD_OFFSET };
      selectedIds = {};
      notes.forEach(function(n){
        if(n.x < boxLogical.x2 && n.x+n.w > boxLogical.x1 && n.y < boxLogical.y2 && n.y+n.h > boxLogical.y1){
          selectedIds[n.id] = true;
        }
      });
      renderBoard(); renderSelectionBar();
    }
    board.addEventListener('pointerdown', function(e){
      if(boardMode !== 'free') return;
      if(e.target !== board && e.target !== boardInner) return; // only empty space
      if(e.pointerType === 'mouse'){
        beginMarquee(e.clientX, e.clientY);
        board.setPointerCapture(e.pointerId);
      } else {
        pendingTouch = true;
        var sx=e.clientX, sy=e.clientY, pid=e.pointerId;
        touchHoldTimer = setTimeout(function(){
          if(pendingTouch){ beginMarquee(sx, sy); try{ board.setPointerCapture(pid); }catch(err){} }
        }, 1000);
      }
    });
    board.addEventListener('pointermove', function(e){
      if(touchHoldTimer && !active){
        clearTimeout(touchHoldTimer); pendingTouch=false;
      }
      if(!active) return;
      updateMarquee(e.clientX, e.clientY);
    });
    function endMarquee(){
      clearTimeout(touchHoldTimer); pendingTouch=false;
      if(active){ active=false; marqueeBox.hidden = true; if(Object.keys(selectedIds).length===0) exitSelectionMode(); else renderSelectionBar(); }
    }
    board.addEventListener('pointerup', endMarquee);
    board.addEventListener('pointercancel', endMarquee);
  })();

  board.addEventListener('click', function(e){
    if((e.target === board || e.target === boardInner) && activeCardId){
      activeCardId = null;
      renderBoard();
    }
  });

  // ---------- SELECTION MODE ----------
  var selectionBar = document.getElementById('selectionBar');
  var selCount = document.getElementById('selCount');
  var selGroupBtn = document.getElementById('selGroupBtn');

  function enterSelectionMode(id){
    selectionMode = true;
    activeCardId = null;
    selectedIds = {}; selectedIds[id] = true;
    renderBoard(); renderSelectionBar();
  }
  function toggleSelect(id){
    if(selectedIds[id]) delete selectedIds[id]; else selectedIds[id] = true;
    renderBoard(); renderSelectionBar();
  }
  function exitSelectionMode(){
    selectionMode = false; selectedIds = {};
    renderBoard(); renderSelectionBar();
  }
  function renderSelectionBar(){
    var ids = Object.keys(selectedIds);
    selectionBar.hidden = !selectionMode;
    if(!selectionMode) return;
    selCount.textContent = ids.length + ' selected';
    var allGrouped = ids.length > 0 && ids.every(function(id){ var n=getNote(id); return n && n.grouped; });
    selGroupBtn.textContent = allGrouped ? 'Ungroup' : 'Group';
    selGroupBtn.disabled = ids.length === 0;
    selGroupBtn.style.opacity = ids.length === 0 ? '0.5' : '1';
  }
  function performGroupToggle(){
    var ids = Object.keys(selectedIds);
    if(ids.length === 0) return;
    var allGrouped = ids.every(function(id){ var n=getNote(id); return n && n.grouped; });
    if(allGrouped){
      ids.forEach(function(id){
        var n = getNote(id);
        if(n && n.grouped){ n.x = n._px; n.y = n._py; n.grouped = false; delete n._px; delete n._py; }
      });
    } else {
      var cols = Math.max(1, Math.ceil(Math.sqrt(ids.length)));
      var cellW = 200, cellH = 180;
      var logicalCX = board.scrollLeft - BOARD_OFFSET + board.clientWidth/2;
      var logicalCY = board.scrollTop - BOARD_OFFSET + board.clientHeight/2;
      var startX = logicalCX - (cols*cellW)/2;
      var startY = logicalCY - 160;
      ids.forEach(function(id, i){
        var n = getNote(id); if(!n) return;
        if(!n.grouped){ n._px = n.x; n._py = n.y; }
        n.grouped = true;
        n.x = startX + (i % cols) * cellW;
        n.y = startY + Math.floor(i / cols) * cellH;
        n.z = ++zTop;
      });
    }
    persistNotes();
    renderBoard();
    renderSelectionBar();
  }
  selGroupBtn.addEventListener('click', performGroupToggle);
  document.getElementById('selDoneBtn').addEventListener('click', exitSelectionMode);

  // ---------- FOLDERS DROPDOWN ----------
  var foldersBtn = document.getElementById('foldersBtn');
  var foldersPanel = document.getElementById('foldersPanel');
  var foldersOpen = false;

  function setFoldersOpen(v){
    foldersOpen = v;
    foldersPanel.hidden = !v;
    foldersBtn.classList.toggle('active', v);
    if(v) renderFoldersPanel();
  }

      if(startX === null) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;

  function readImageSmart(file, cb){
    if(file.type === 'image/gif'){
      var r = new FileReader();
      r.onload = function(e){ cb(e.target.result); };
      r.readAsDataURL(file);
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 2400;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl;
        try{ dataUrl = canvas.toDataURL('image/jpeg', 0.94); }catch(err){ dataUrl = e.target.result; }
        cb(dataUrl);
      };
      img.onerror = function(){ cb(e.target.result); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function startRecording(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      recordStatus.textContent = "Recording isn't supported here — try uploading a file instead.";
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      recordedChunks = [];
      try{ mediaRecorder = new MediaRecorder(stream); }catch(e){
        recordStatus.textContent = "Recording isn't supported here — try uploading a file instead.";
        return;
      }
      mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        clearInterval(recordTimerInterval);
        var blob = new Blob(recordedChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
        var reader = new FileReader();
        reader.onload = function(e){
          var note = getNote(openNoteId);
          if(!note) return;
          note.audio = e.target.result;
          touch(note); scheduleSave(true);
          resetAudioUI(note);
        };
        reader.readAsDataURL(blob);
        recordBtn.classList.remove('recording');
      };
      mediaRecorder.start();
      recordBtn.classList.add('recording');
      recordStartTime = Date.now();
      recordTimerInterval = setInterval(function(){
        var secs = Math.floor((Date.now()-recordStartTime)/1000);
        var mm = Math.floor(secs/60), ss = secs%60;
        recordStatus.textContent = 'Recording… ' + mm + ':' + (ss<10?'0':'')+ss;
      }, 250);
    }).catch(function(){
      recordStatus.textContent = "Microphone access denied — try uploading a file instead.";
    });
  }

  recordBtn.addEventListener('click', function(){
    if(mediaRecorder && mediaRecorder.state === 'recording'){ mediaRecorder.stop(); }
    else { startRecording(); }
  });
  audioReRecordBtn.addEventListener('click', function(){ startRecording(); });
  document.getElementById('audioUploadBtn').addEventListener('click', function(){ audioUploadInput.click(); });
  audioUploadInput.addEventListener('change', function(){
    var note = getNote(openNoteId);
    var file = audioUploadInput.files && audioUploadInput.files[0];
    if(!note || !file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      note.audio = e.target.result; touch(note); scheduleSave(true); resetAudioUI(note);
    };
    reader.readAsDataURL(file);
    audioUploadInput.value = '';
  });

  document.getElementById('pinBtn').addEventListener('click', function(){
    var note = getNote(openNoteId); if(!note) return;
    note.pinned = !note.pinned;
    if(note.pinned){
      if(!note._prePinX0 && note._prePinX0 !== 0){ /* no-op, position already stable */ }
    } else {
      // returning from pinned: keep current place (pin no longer relocates, so nothing to restore)
    }
    touch(note); scheduleSave(true); updatePinBtn(note);
  });
  lockBtn.addEventListener('click', function(){
    var note = getNote(openNoteId); if(!note) return;
    note.locked = !note.locked; touch(note); scheduleSave(true); updateLockBtn(note);
  });

  function touch(note){ note.updatedAt = Date.now(); }
  function scheduleSave(immediate){
    var indicator = document.getElementById('saveIndicator');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      persistNotes();
      indicator.style.opacity = '1';
      clearTimeout(indicator._t);
      indicator._t = setTimeout(function(){ indicator.style.opacity = '0'; }, 1200);
    }, immediate ? 0 : 250);
  }

  // ---------- FULL-QUALITY PHOTO VIEWER (pinch / wheel zoom + pan) ----------
  (function(){
    var viewer = document.getElementById('photoViewer');
    var stage = document.getElementById('photoViewerStage');
    var img = document.getElementById('photoViewerImg');
    var scale = 1, tx = 0, ty = 0, pts = {}, pinchD = null, pinchS = 1, lastX = 0, lastY = 0, panning = false;
    function apply(){ img.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')'; }
    function reset(){ scale = 1; tx = 0; ty = 0; apply(); }
    function open(src){ img.src = src; reset(); viewer.hidden = false; }
    function close(){ viewer.hidden = true; img.src = ''; }
    document.getElementById('photoDisplay').addEventListener('click', function(){
      var note = getNote(openNoteId);
      if(note && note.image) open(note.image);
    });
    document.getElementById('photoViewerClose').addEventListener('click', close);
    stage.addEventListener('wheel', function(e){
      e.preventDefault();
      scale = clamp(scale * (e.deltaY < 0 ? 1.12 : 1/1.12), 1, 8);
      if(scale === 1){ tx = 0; ty = 0; }
      apply();
    }, {passive:false});
    stage.addEventListener('dblclick', function(){ if(scale > 1) reset(); else { scale = 2.5; apply(); } });
    stage.addEventListener('pointerdown', function(e){
      stage.setPointerCapture(e.pointerId);
      pts[e.pointerId] = {x:e.clientX, y:e.clientY};
      lastX = e.clientX; lastY = e.clientY; panning = true; pinchD = null;
    });
    stage.addEventListener('pointermove', function(e){
      if(!pts[e.pointerId]) return;
      pts[e.pointerId] = {x:e.clientX, y:e.clientY};
      var ids = Object.keys(pts);
      if(ids.length === 2){
        var a = pts[ids[0]], b = pts[ids[1]];
        var d = Math.hypot(a.x-b.x, a.y-b.y);
        if(pinchD === null){ pinchD = d; pinchS = scale; }
        else { scale = clamp(pinchS * d / pinchD, 1, 8); if(scale === 1){ tx = 0; ty = 0; } apply(); }
      } else if(panning && scale > 1){
        tx += e.clientX - lastX; ty += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; apply();
      }
    });
    function up(e){ delete pts[e.pointerId]; pinchD = null; if(Object.keys(pts).length === 0) panning = false; }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !viewer.hidden){ close(); e.stopImmediatePropagation(); } }, true);
  })();

  // ---------- DRAWING ----------
  var drawOverlay = document.getElementById('drawOverlay');
  var drawCanvas = document.getElementById('drawCanvas');
  var drawCtx = null, isDrawing = false, lastX = 0, lastY = 0, drawColor = '#242220';
  var DRAW_COLORS = ['#242220','#AF4A3C','#3E5C55','#2C5AA0'];

  function renderDrawColors(){
    var wrap = document.getElementById('drawColors');
    wrap.innerHTML = DRAW_COLORS.map(function(c){
      return '<button class="draw-color-dot'+(c===drawColor?' active':'')+'" data-color="'+c+'" style="background:'+c+'"></button>';
    }).join('');
    Array.prototype.forEach.call(wrap.querySelectorAll('.draw-color-dot'), function(dot){
      dot.addEventListener('click', function(){
        drawColor = dot.getAttribute('data-color');
        if(drawCtx) drawCtx.strokeStyle = drawColor;
        renderDrawColors();
      });
    });
  }

  document.getElementById('drawBtn').addEventListener('click', function(){
    drawOverlay.hidden = false;
    requestAnimationFrame(function(){
      var rect = drawCanvas.getBoundingClientRect();
      var ratio = window.devicePixelRatio || 1;
      drawCanvas.width = rect.width * ratio;
      drawCanvas.height = rect.height * ratio;
      drawCtx = drawCanvas.getContext('2d');
      drawCtx.scale(ratio, ratio);
      drawCtx.fillStyle = '#fff';
      drawCtx.fillRect(0,0,rect.width,rect.height);
      drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
      drawCtx.strokeStyle = drawColor;
      renderDrawColors();
    });
  });

  function drawPos(e){
    var rect = drawCanvas.getBoundingClientRect();
    return {x: e.clientX - rect.left, y: e.clientY - rect.top};
  }
  drawCanvas.addEventListener('pointerdown', function(e){
    isDrawing = true;
    drawCanvas.setPointerCapture(e.pointerId);
    var p = drawPos(e);
    lastX = p.x; lastY = p.y;
  });
  drawCanvas.addEventListener('pointermove', function(e){
    if(!isDrawing || !drawCtx) return;
    var p = drawPos(e);
    var pressure = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.5;
    drawCtx.lineWidth = 1.5 + pressure * 4;
    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
    drawCtx.lineTo(p.x, p.y);
    drawCtx.stroke();
    lastX = p.x; lastY = p.y;
  });
  function endDraw(){ isDrawing = false; }
  drawCanvas.addEventListener('pointerup', endDraw);
  drawCanvas.addEventListener('pointercancel', endDraw);

  document.getElementById('drawClearBtn').addEventListener('click', function(){
    if(!drawCtx) return;
    var rect = drawCanvas.getBoundingClientRect();
    drawCtx.fillStyle = '#fff';
    drawCtx.fillRect(0,0,rect.width,rect.height);
  });
  document.getElementById('drawCancelBtn').addEventListener('click', function(){ drawOverlay.hidden = true; });
  document.getElementById('drawDoneBtn').addEventListener('click', function(){
    var dataUrl = drawCanvas.toDataURL('image/png');
    drawOverlay.hidden = true;
    insertInlineImage(dataUrl);
  });

  // ---------- DELETE ----------
  function askDelete(id){
    pendingDeleteNoteId = id; pendingDeleteFolderId = null;
    document.getElementById('modalTitle').textContent = 'Delete';
    document.getElementById('modalMessage').textContent = "This can't be undone. It will be permanently deleted.";
    document.getElementById('modalConfirm').textContent = 'Delete';
    showModal();
  }
  function askDeleteFolder(id){
    pendingDeleteFolderId = id; pendingDeleteNoteId = null;
    var f = getFolder(id);
    document.getElementById('modalTitle').textContent = 'Delete folder';
    document.getElementById('modalMessage').textContent = 'Notes in "'+(f?f.name:'this folder')+'" will move to All. This can\'t be undone.';
    document.getElementById('modalConfirm').textContent = 'Delete folder';
    showModal();
  }
  function showModal(){ document.getElementById('modalOverlay').classList.add('show'); }
  function hideModal(){ document.getElementById('modalOverlay').classList.remove('show'); pendingDeleteNoteId=null; pendingDeleteFolderId=null; renderBoard(); }
  function performDelete(){
    if(pendingDeleteNoteId){
      notes = notes.filter(function(n){ return n.id !== pendingDeleteNoteId; });
      persistNotes();
      if(openNoteId === pendingDeleteNoteId){ editorPage.hidden = true; openNoteId = null; }
      if(activeCardId === pendingDeleteNoteId) activeCardId = null;
      renderAll();
    } else if(pendingDeleteFolderId){
      var fid = pendingDeleteFolderId;
      notes.forEach(function(n){ if(n.folderId===fid) n.folderId = null; });
      folders = folders.filter(function(f){ return f.id !== fid; });
      persistNotes(); persistFolders();
      if(selectedFolder === fid) selectedFolder = 'all';
      renderAll();
    }
    hideModal();
  }
  document.getElementById('modalCancel').addEventListener('click', hideModal);
  document.getElementById('modalConfirm').addEventListener('click', performDelete);
  document.getElementById('modalOverlay').addEventListener('mousedown', function(e){ if(e.target.id==='modalOverlay') hideModal(); });

  document.addEventListener('keydown', function(e){
    var mod = e.metaKey || e.ctrlKey;
    if(mod && (e.key==='n'||e.key==='N')){ e.preventDefault(); createItem('note'); }
    else if(e.key === 'Escape'){
      if(!drawOverlay.hidden) drawOverlay.hidden = true;
      else if(!editorPage.hidden) closeEditor();
      else if(document.getElementById('modalOverlay').classList.contains('show')) hideModal();
      else if(fabMenuOpen) setFabMenu(false);
      else if(selectionMode) exitSelectionMode();
    }
  });

  function renderAll(){
    renderBoard();
    if(foldersOpen) renderFoldersPanel();
  }

  // ---------- INIT ----------
  initTheme();
  loadNotesAsync().then(function(list){
    notes = list || [];
    loadState();
    stateLoaded = true;
    if(notesFromLegacy) persistNotes();
    updateArrangeBtn();
    renderAll();
  });
})();
</script>
</body>
