  // ---------- MARQUEE SELECT (mouse drag / long-press+drag on touch) ----------
  var marqueeBox = document.getElementById('marqueeBox');
  (function(){
    var startX=null, startY=null, startCX=0, startCY=0, active=false, touchHoldTimer=null, pendingTouch=false;
    function beginMarquee(clientX, clientY){
      active = true;
      startCX = clientX; startCY = clientY;
      var rect = board.getBoundingClientRect();
      var zz = boardZoom || 1;
      startX = (clientX - rect.left + board.scrollLeft) / zz;
      startY = (clientY - rect.top + board.scrollTop) / zz;
      if(!selectionMode){ selectionMode = true; selectedIds = {}; }
      marqueeBox.hidden = false;
      updateMarquee(clientX, clientY);
    }
    function updateMarquee(clientX, clientY){
      var rect = board.getBoundingClientRect();
      var zz = boardZoom || 1;
      var curX = (clientX - rect.left + board.scrollLeft) / zz;
      var curY = (clientY - rect.top + board.scrollTop) / zz;
      var x = Math.min(startX,curX), y = Math.min(startY,curY);
      var w = Math.abs(curX-startX), h = Math.abs(curY-startY);
      marqueeBox.style.left = Math.min(startCX, clientX)+'px'; marqueeBox.style.top = Math.min(startCY, clientY)+'px';
      marqueeBox.style.width = Math.abs(clientX-startCX)+'px'; marqueeBox.style.height = Math.abs(clientY-startCY)+'px';
      var boxLogical = { x1:x-offX, y1:y-offY, x2:x+w-offX, y2:y+h-offY };
      selectedIds = {};
      notes.forEach(function(n){
        if(n.x < boxLogical.x2 && n.x+n.w > boxLogical.x1 && n.y < boxLogical.y2 && n.y+n.h > boxLogical.y1){
          selectedIds[n.id] = true;
        }
      });
      renderBoard(); renderSelectionBar();
    }
    board.addEventListener('pointerdown', function(e){
      if(boardMode !== 'free') return;
      if(e.target !== board && e.target !== boardInner) return; // only empty space
      if(e.pointerType === 'mouse'){
        beginMarquee(e.clientX, e.clientY);
        board.setPointerCapture(e.pointerId);
      } else {
        pendingTouch = true;
        var sx=e.clientX, sy=e.clientY, pid=e.pointerId;
        touchHoldTimer = setTimeout(function(){
          if(pendingTouch){ beginMarquee(sx, sy); try{ board.setPointerCapture(pid); }catch(err){} }
        }, 1000);
      }
    });
    board.addEventListener('pointermove', function(e){
      if(touchHoldTimer && !active){
        clearTimeout(touchHoldTimer); pendingTouch=false;
      }
      if(!active) return;
      updateMarquee(e.clientX, e.clientY);
    });
    function endMarquee(){
      clearTimeout(touchHoldTimer); pendingTouch=false;
      if(active){ active=false; marqueeBox.hidden = true; if(Object.keys(selectedIds).length===0) exitSelectionMode(); else renderSelectionBar(); }
    }
    board.addEventListener('pointerup', endMarquee);
    board.addEventListener('pointercancel', endMarquee);
  })();

  board.addEventListener('click', function(e){
    if((e.target === board || e.target === boardInner) && activeCardId){
      activeCardId = null;
      renderBoard();
    }
  });

  // ---------- SELECTION MODE ----------
  var selectionBar = document.getElementById('selectionBar');
  var selCount = document.getElementById('selCount');

  function enterSelectionMode(id){
    selectionMode = true;
    activeCardId = null;
    selectedIds = {}; selectedIds[id] = true;

  }
  function toggleSelect(id){
    if(selectedIds[id]) delete selectedIds[id]; else selectedIds[id] = true;
    renderBoard(); renderSelectionBar();
  }
  function exitSelectionMode(){
    selectionMode = false; selectedIds = {};
    renderBoard(); renderSelectionBar();
  }
  var selFolderBtn = document.getElementById('selFolderBtn');
  var selFolderPop = document.getElementById('selFolderPop');
  var selDeleteBtn = document.getElementById('selDeleteBtn');
  var selFolderOpen = false;
  function setSelFolderOpen(v){
    selFolderOpen = v;
    selFolderPop.hidden = !v;
    if(v) renderSelFolderPop();
  }
  function renderSelFolderPop(){
    var html = '<button data-move="">No folder</button>';
    folders.forEach(function(f){ html += '<button data-move="'+f.id+'">'+escapeHtml(f.name)+'</button>'; });
    if(!folders.length) html += '<div class="sel-empty">Create folders from the + menu</div>';
    selFolderPop.innerHTML = html;
  }
  function renderSelectionBar(){
    var ids = Object.keys(selectedIds);
    selectionBar.hidden = !selectionMode;
    document.body.classList.toggle('selecting', selectionMode);
    if(!selectionMode){ setSelFolderOpen(false); return; }

      btn.disabled = ids.length === 0;

  selFolderBtn.addEventListener('click', function(){ if(Object.keys(selectedIds).length) setSelFolderOpen(!selFolderOpen); });
  selFolderPop.addEventListener('click', function(e){
    var btn = e.target.closest('[data-move]');
    if(!btn) return;
    var fid = btn.getAttribute('data-move') || null;

    var f = fid ? getFolder(fid) : null;

    setSelFolderOpen(false);

  });
  document.addEventListener('pointerdown', function(e){
    if(!selFolderOpen) return;
    if(selFolderPop.contains(e.target) || selFolderBtn.contains(e.target)) return;
    setSelFolderOpen(false);
  });
  selDeleteBtn.addEventListener('click', function(){
    var ids = Object.keys(selectedIds);
    if(!ids.length) return;
    pendingDeleteNoteIds = ids; pendingDeleteNoteId = null; pendingDeleteFolderId = null;

  function pasteFromClipboard(){

  // ---------- ITEM CREATE ----------
  function baseNewItem(kind){
    var size = defaultSize(kind);
    var pos = placeNewNotePosition(size);
    var item = {
      id: uid(), kind: kind, title: '', body: '', folderId: (selectedFolder!=='all'?selectedFolder:null),
      pinned:false, locked:false, grouped:false, createdAt: Date.now(), updatedAt: Date.now(),
      x: pos.x, y: pos.y, rot: Math.round((Math.random()*6-3)*10)/10,
      w: size.w, h: size.h, sized: false, color: 'paper', image: null, audio: null, url:null, z: ++zTop
    };
    lastNewCenter = { id:item.id, cx:pos.cx, cy:pos.cy, nudge:pos.nudge }; // not saved with the note
    return item;
  }
  // New cards have automatic height, so once rendered we measure the real height and centre it exactly on the view.
  var lastNewCenter = null;
  function recenterNewItem(note){
    if(!lastNewCenter || lastNewCenter.id !== note.id || boardMode !== 'free' || note.sized) return;
    function fix(){
      if(!lastNewCenter || lastNewCenter.id !== note.id) return;
      var el = boardInner.querySelector('.card[data-note-id="'+note.id+'"]');
      if(!el) return;
      var z = boardZoom || 1, r = el.getBoundingClientRect();
      var th = Math.abs(note.rot) * Math.PI / 180;
      var h = ((r.height - note.w * z * Math.sin(th)) / Math.cos(th)) / z; // un-rotated logical height
      if(!isFinite(h) || h < 10) return; // not laid out yet (e.g. photo still decoding)
      note.y = lastNewCenter.cy - h/2 + lastNewCenter.nudge;
      el.style.transform = 'translate('+(note.x+offX)+'px,'+(note.y+offY)+'px) rotate('+note.rot+'deg)';
      lastNewCenter = null;
      persistNotes();
    }
    fix();
    var el0 = boardInner.querySelector('.card[data-note-id="'+note.id+'"]');
    var img = el0 && el0.querySelector('img');
    if(lastNewCenter && img && !img.complete) img.addEventListener('load', fix, {once:true});
  }

  function createItem(kind){
    var note = baseNewItem(kind);
    notes.unshift(note);
    persistNotes();
    if(boardMode === 'masonry') { boardMode='free'; persistMode(); updateArrangeBtn(); }
    renderAll();
    recenterNewItem(note);
    openEditor(note.id);

  // ---------- PASTE IMAGE ----------
  document.addEventListener('paste', function(e){
    var items = (e.clipboardData || window.clipboardData) ? (e.clipboardData || window.clipboardData).items : null;
    if(!items) return;
    var imageItem = null;
    for(var i=0;i<items.length;i++){ if(items[i].type && items[i].type.indexOf('image') === 0){ imageItem = items[i]; break; } }
    if(!imageItem){
      if(editorPage.hidden && !fabMenuOpen){
        var ae = document.activeElement;
        var typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
        if(!typing){
          var txt = (e.clipboardData || window.clipboardData).getData('text');
          if(txt && createFromText(txt)) e.preventDefault();
        }
      }
      return;
    }
    var file = imageItem.getAsFile();
    if(!file) return;
    e.preventDefault();
    var editingNote = openNoteId ? getNote(openNoteId) : null;
    if(editingNote && editingNote.kind === 'note' && !editorPage.hidden){
      readImageSmart(file, function(dataUrl){ insertInlineImage(dataUrl); });

      readImageSmart(file, function(dataUrl){ createPhotoFromDataUrl(dataUrl); });

    if(idx === -1) return;
    var newIdx = (idx + direction + list.length) % list.length;
    editorPage.style.transition = 'opacity 0.14s ease, transform 0.14s ease';
    editorPage.style.opacity = '0';

  // whole-page gesture: swipe L/R to navigate, swipe U/D to close. Works from anywhere
  // that isn't an interactive control, including starting well before the exact edge.
  (function(){

    editorPage.addEventListener('pointerdown', function(e){
      if(isInteractiveTarget(e.target)) return;
      startX = e.clientX; startY = e.clientY; startTime = Date.now();
    });
    editorPage.addEventListener('pointerup', function(e){
      if(startX === null) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      startX = null;
      var absX = Math.abs(dx), absY = Math.abs(dy);
      if(absX < 45 && absY < 45) return;
      if(absX > absY){ if(absX > 60) navigateAnimated(dx < 0 ? 1 : -1); }
      else { if(dy > 70 || dy < -70) closeEditor(); }

  // ---------- TEXT TOOLS BAR ----------
  // Visible only while the cursor is in a note's body. On touch devices it sits right above the on-screen
  // keyboard and disappears when the keyboard closes; on desktop it sits above the editor's bottom bar.
  var textTools = document.getElementById('textToolsBar');
  var editorScrollEl = document.querySelector('#editorPage .editor-scroll');
  var editorBottombarEl = document.getElementById('editorBottombar');
  var vv = window.visualViewport || null;
  var coarsePointer = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var kbBase = vv ? vv.height : window.innerHeight;   // visible height with no keyboard
  var toolsWanted = false;
  function isEditing(){
    var ae = document.activeElement;
    return !!ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  }
  function keyboardOpen(){ return vv ? (kbBase - vv.height > 140) : true; }
  function updateTextTools(){
    if(vv && !isEditing()) kbBase = vv.height;        // only learn the "no keyboard" height while nothing is being typed
    var show = toolsWanted && (!coarsePointer || keyboardOpen());
    textTools.hidden = !show;
    if(!show){ editorScrollEl.style.paddingBottom = ''; return; }
    // bottom offset: gap between the layout viewport and the visible one (= keyboard height) on touch; bottom bar height on desktop
    var bottom = coarsePointer ? (vv ? Math.max(0, window.innerHeight - vv.offsetTop - vv.height) : 0) : editorBottombarEl.offsetHeight;
    textTools.style.bottom = Math.round(bottom) + 'px';
    editorScrollEl.style.paddingBottom = Math.round((coarsePointer ? bottom : 0) + textTools.offsetHeight + 10) + 'px';
    keepCaretAboveTools();
  }
  function setTextTools(on){ toolsWanted = on; updateTextTools(); }
  // keep the line being typed from hiding behind the bar
  function keepCaretAboveTools(){
    if(textTools.hidden) return;
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount || !bodyEl.contains(sel.anchorNode)) return;
    var rect = null;
    try{ var r = sel.getRangeAt(0).cloneRange(); r.collapse(false); var rs = r.getClientRects(); rect = rs.length ? rs[0] : null; }catch(err){}
    if(!rect || !rect.height){
      var node = sel.anchorNode, el = node && (node.nodeType === 1 ? node : node.parentElement);
      if(!el || el === bodyEl) return;
      rect = el.getBoundingClientRect();
    }
    if(rect.height > 200) return;
    var limit = textTools.getBoundingClientRect().top - 10;
    if(rect.bottom > limit) editorScrollEl.scrollTop += rect.bottom - limit;
  }
  bodyEl.addEventListener('focus', function(){ var n = getNote(openNoteId); setTextTools(!!n && n.kind === 'note'); });
  bodyEl.addEventListener('blur', function(){ setTimeout(function(){ if(document.activeElement !== bodyEl) setTextTools(false); }, 60); });
  if(vv){ vv.addEventListener('resize', updateTextTools); vv.addEventListener('scroll', updateTextTools); }
  window.addEventListener('resize', updateTextTools);
  document.addEventListener('selectionchange', keepCaretAboveTools);
  textTools.addEventListener('mousedown', function(e){ e.preventDefault(); });   // tapping a tool keeps the cursor and the keyboard

  Array.prototype.forEach.call(document.querySelectorAll('#textToolsBar [data-cmd]'), function(btn){
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    btn.addEventListener('click', function(){
      var note = getNote(openNoteId); if(!note) return;
      bodyEl.focus();
      var cmd = btn.getAttribute('data-cmd');
      if(cmd==='bold') document.execCommand('bold');
      else if(cmd==='italic') document.execCommand('italic');
      else if(cmd==='h1') document.execCommand('formatBlock', false, 'H1');
      else if(cmd==='h2') document.execCommand('formatBlock', false, 'H2');
      else if(cmd==='ul') document.execCommand('insertUnorderedList');
      note.body = bodyEl.innerHTML; touch(note); scheduleSave();
    });
  });

  function insertNodeAtCursor(node){
    bodyEl.focus();
    var sel = window.getSelection();
    var range;
    if(sel && sel.rangeCount && bodyEl.contains(sel.anchorNode)){ range = sel.getRangeAt(0); }
    else { range = document.createRange(); range.selectNodeContents(bodyEl); range.collapse(false); }
    range.deleteContents();
    range.insertNode(node);
    range.setStartAfter(node); range.collapse(true);
    sel.removeAllRanges(); sel.addRange(range);
  }
  function insertInlineImage(dataUrl){
    var img = document.createElement('img');
    img.src = dataUrl;
    insertNodeAtCursor(img);
    var note = getNote(openNoteId); if(!note) return;
    note.body = bodyEl.innerHTML; touch(note); scheduleSave(true);
  }
  function insertInlineAudio(dataUrl){
    var wrap = document.createElement('span');
    wrap.setAttribute('contenteditable','false');
    var audioEl = document.createElement('audio');
    audioEl.controls = true; audioEl.src = dataUrl;
    wrap.appendChild(audioEl);
    insertNodeAtCursor(wrap);
    insertNodeAtCursor(document.createElement('br'));
    var note = getNote(openNoteId); if(!note) return;
    note.body = bodyEl.innerHTML; touch(note); scheduleSave(true);
  }

  document.getElementById('imageBtn').addEventListener('click', function(){ imageInput.click(); });
  imageInput.addEventListener('change', function(){
    var file = imageInput.files && imageInput.files[0];
    if(!file) return;
    readImageSmart(file, function(dataUrl){ insertInlineImage(dataUrl); });
    imageInput.value = '';
  });

  document.getElementById('noteAudioBtn').addEventListener('click', function(){ noteAudioInput.click(); });
  noteAudioInput.addEventListener('change', function(){
    var file = noteAudioInput.files && noteAudioInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){ insertInlineAudio(e.target.result); };
    reader.readAsDataURL(file);
    noteAudioInput.value = '';
  });

  function readImageSmart(file, cb){
    if(file.type === 'image/gif'){
      var r = new FileReader();
      r.onload = function(e){ cb(e.target.result); };
      r.readAsDataURL(file);
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 2400;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl;
        try{ dataUrl = canvas.toDataURL('image/jpeg', 0.94); }catch(err){ dataUrl = e.target.result; }
        cb(dataUrl);
      };
      img.onerror = function(){ cb(e.target.result); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  quickInput.addEventListener('input', function(){
    var note = getNote(openNoteId); if(!note) return;
    note.body = quickInput.value; touch(note); scheduleSave();
  });

  photoCaptionInput.addEventListener('input', function(){
    var note = getNote(openNoteId); if(!note) return;
    note.title = photoCaptionInput.value; touch(note); scheduleSave();
  });

  linkTitleInput.addEventListener('input', function(){
    var note = getNote(openNoteId); if(!note) return;
    note.title = linkTitleInput.value; touch(note); scheduleSave();
  });
  linkUrlInput.addEventListener('input', function(){
    var note = getNote(openNoteId); if(!note) return;
    var v = linkUrlInput.value.trim();
    note.url = v; touch(note); scheduleSave();
  });
  document.getElementById('linkIconBig').addEventListener('click', function(){
    var note = getNote(openNoteId); if(!note || !note.url) return;
    window.open(note.url, '_blank');
  });
  document.getElementById('linkVisitBtn').addEventListener('click', function(){
    var note = getNote(openNoteId); if(!note || !note.url) return;
    window.open(note.url, '_blank');
  });

  function resetAudioUI(note){
    audioTitleInput.value = note.title || '';
    if(note.audio){
      audioPlayer.src = note.audio;
      audioPlayerWrap.hidden = false;
      recordStatus.textContent = 'Tap the mic to re-record';
      audioReRecordBtn.hidden = false;
    } else {
      audioPlayer.src = '';
      audioPlayerWrap.hidden = true;
      recordStatus.textContent = 'Tap to record';
      audioReRecordBtn.hidden = true;
    }
    recordBtn.classList.remove('recording');
  }
  audioTitleInput.addEventListener('input', function(){
    var note = getNote(openNoteId); if(!note) return;
    note.title = audioTitleInput.value; touch(note); scheduleSave();
  });

  function stopRecordingIfActive(){
    if(mediaRecorder && mediaRecorder.state === 'recording'){ mediaRecorder.stop(); }
    clearInterval(recordTimerInterval);
  }

  function startRecording(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      recordStatus.textContent = "Recording isn't supported here — try uploading a file instead.";
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      recordedChunks = [];
      try{ mediaRecorder = new MediaRecorder(stream); }catch(e){
        recordStatus.textContent = "Recording isn't supported here — try uploading a file instead.";
        return;
      }
      mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        clearInterval(recordTimerInterval);
        var blob = new Blob(recordedChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
        var reader = new FileReader();
        reader.onload = function(e){
          var note = getNote(openNoteId);
          if(!note) return;
          note.audio = e.target.result;
          touch(note); scheduleSave(true);
          resetAudioUI(note);
        };
        reader.readAsDataURL(blob);
        recordBtn.classList.remove('recording');
      };
      mediaRecorder.start();
      recordBtn.classList.add('recording');
      recordStartTime = Date.now();
      recordTimerInterval = setInterval(function(){
        var secs = Math.floor((Date.now()-recordStartTime)/1000);
        var mm = Math.floor(secs/60), ss = secs%60;
        recordStatus.textContent = 'Recording… ' + mm + ':' + (ss<10?'0':'')+ss;
      }, 250);
    }).catch(function(){
      recordStatus.textContent = "Microphone access denied — try uploading a file instead.";
    });
  }

  recordBtn.addEventListener('click', function(){
    if(mediaRecorder && mediaRecorder.state === 'recording'){ mediaRecorder.stop(); }
    else { startRecording(); }
  });
  audioReRecordBtn.addEventListener('click', function(){ startRecording(); });
  document.getElementById('audioUploadBtn').addEventListener('click', function(){ audioUploadInput.click(); });
  audioUploadInput.addEventListener('change', function(){
    var note = getNote(openNoteId);
    var file = audioUploadInput.files && audioUploadInput.files[0];
    if(!note || !file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      note.audio = e.target.result; touch(note); scheduleSave(true); resetAudioUI(note);
    };
    reader.readAsDataURL(file);
    audioUploadInput.value = '';
  });

  document.getElementById('pinBtn').addEventListener('click', function(){
    var note = getNote(openNoteId); if(!note) return;
    note.pinned = !note.pinned;
    if(note.pinned){
      if(!note._prePinX0 && note._prePinX0 !== 0){ /* no-op, position already stable */ }
    } else {
      // returning from pinned: keep current place (pin no longer relocates, so nothing to restore)
    }
    touch(note); scheduleSave(true); updatePinBtn(note);
  });
  lockBtn.addEventListener('click', function(){
    var note = getNote(openNoteId); if(!note) return;
    note.locked = !note.locked; touch(note); scheduleSave(true); updateLockBtn(note);
  });

  function touch(note){ note.updatedAt = Date.now(); }
  function scheduleSave(immediate){
    var indicator = document.getElementById('saveIndicator');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      persistNotes();
      indicator.style.opacity = '1';
      clearTimeout(indicator._t);
      indicator._t = setTimeout(function(){ indicator.style.opacity = '0'; }, 1200);
    }, immediate ? 0 : 250);
  }

  // ---------- FULL-QUALITY PHOTO VIEWER (pinch / wheel zoom + pan) ----------
  (function(){
    var viewer = document.getElementById('photoViewer');
    var stage = document.getElementById('photoViewerStage');
    var img = document.getElementById('photoViewerImg');
    var scale = 1, tx = 0, ty = 0, pts = {}, pinchD = null, pinchS = 1, lastX = 0, lastY = 0, panning = false;
    function apply(){ img.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')'; }
    function reset(){ scale = 1; tx = 0; ty = 0; apply(); }
    function open(src){ img.src = src; reset(); viewer.hidden = false; }
    function close(){ viewer.hidden = true; img.src = ''; }
    document.getElementById('photoDisplay').addEventListener('click', function(){
      var note = getNote(openNoteId);
      if(note && note.image) open(note.image);
    });
    document.getElementById('photoViewerClose').addEventListener('click', close);
    stage.addEventListener('wheel', function(e){
      e.preventDefault();
      scale = clamp(scale * (e.deltaY < 0 ? 1.12 : 1/1.12), 1, 8);
      if(scale === 1){ tx = 0; ty = 0; }
      apply();
    }, {passive:false});
    stage.addEventListener('dblclick', function(){ if(scale > 1) reset(); else { scale = 2.5; apply(); } });
    stage.addEventListener('pointerdown', function(e){
      stage.setPointerCapture(e.pointerId);
      pts[e.pointerId] = {x:e.clientX, y:e.clientY};
      lastX = e.clientX; lastY = e.clientY; panning = true; pinchD = null;
    });
    stage.addEventListener('pointermove', function(e){
      if(!pts[e.pointerId]) return;
      pts[e.pointerId] = {x:e.clientX, y:e.clientY};
      var ids = Object.keys(pts);
      if(ids.length === 2){
        var a = pts[ids[0]], b = pts[ids[1]];
        var d = Math.hypot(a.x-b.x, a.y-b.y);
        if(pinchD === null){ pinchD = d; pinchS = scale; }
        else { scale = clamp(pinchS * d / pinchD, 1, 8); if(scale === 1){ tx = 0; ty = 0; } apply(); }
      } else if(panning && scale > 1){
        tx += e.clientX - lastX; ty += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; apply();
      }
    });
    function up(e){ delete pts[e.pointerId]; pinchD = null; if(Object.keys(pts).length === 0) panning = false; }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !viewer.hidden){ close(); e.stopImmediatePropagation(); } }, true);
  })();

  // ---------- DRAWING ----------
  var drawOverlay = document.getElementById('drawOverlay');
  var drawCanvas = document.getElementById('drawCanvas');
  var drawCtx = null, isDrawing = false, lastX = 0, lastY = 0, drawColor = '#242220';
  var DRAW_COLORS = ['#242220','#AF4A3C','#3E5C55','#2C5AA0'];

  function renderDrawColors(){
    var wrap = document.getElementById('drawColors');
    wrap.innerHTML = DRAW_COLORS.map(function(c){
      return '<button class="draw-color-dot'+(c===drawColor?' active':'')+'" data-color="'+c+'" style="background:'+c+'"></button>';
    }).join('');
    Array.prototype.forEach.call(wrap.querySelectorAll('.draw-color-dot'), function(dot){
      dot.addEventListener('click', function(){
        drawColor = dot.getAttribute('data-color');
        if(drawCtx) drawCtx.strokeStyle = drawColor;
        renderDrawColors();
      });
    });
  }

  document.getElementById('drawBtn').addEventListener('click', function(){
    drawOverlay.hidden = false;
    requestAnimationFrame(function(){
      var rect = drawCanvas.getBoundingClientRect();
      var ratio = window.devicePixelRatio || 1;
      drawCanvas.width = rect.width * ratio;
      drawCanvas.height = rect.height * ratio;
      drawCtx = drawCanvas.getContext('2d');
      drawCtx.scale(ratio, ratio);
      drawCtx.fillStyle = '#fff';
      drawCtx.fillRect(0,0,rect.width,rect.height);
      drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
      drawCtx.strokeStyle = drawColor;
      renderDrawColors();
    });
  });

  function drawPos(e){
    var rect = drawCanvas.getBoundingClientRect();
    return {x: e.clientX - rect.left, y: e.clientY - rect.top};
  }
  drawCanvas.addEventListener('pointerdown', function(e){
    isDrawing = true;
    drawCanvas.setPointerCapture(e.pointerId);
    var p = drawPos(e);
    lastX = p.x; lastY = p.y;
  });
  drawCanvas.addEventListener('pointermove', function(e){
    if(!isDrawing || !drawCtx) return;
    var p = drawPos(e);
    var pressure = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.5;
    drawCtx.lineWidth = 1.5 + pressure * 4;
    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
    drawCtx.lineTo(p.x, p.y);
    drawCtx.stroke();
    lastX = p.x; lastY = p.y;
  });
  function endDraw(){ isDrawing = false; }
  drawCanvas.addEventListener('pointerup', endDraw);
  drawCanvas.addEventListener('pointercancel', endDraw);

  document.getElementById('drawClearBtn').addEventListener('click', function(){
    if(!drawCtx) return;
    var rect = drawCanvas.getBoundingClientRect();
    drawCtx.fillStyle = '#fff';
    drawCtx.fillRect(0,0,rect.width,rect.height);
  });
  document.getElementById('drawCancelBtn').addEventListener('click', function(){ drawOverlay.hidden = true; });
  document.getElementById('drawDoneBtn').addEventListener('click', function(){
    var dataUrl = drawCanvas.toDataURL('image/png');
    drawOverlay.hidden = true;
    insertInlineImage(dataUrl);
  });

  // ---------- DELETE ----------
  function askDelete(id){
    pendingDeleteNoteId = id; pendingDeleteFolderId = null; pendingDeleteNoteIds = null;
    document.getElementById('modalTitle').textContent = 'Delete';
    document.getElementById('modalMessage').textContent = "This can't be undone. It will be permanently deleted.";
    document.getElementById('modalConfirm').textContent = 'Delete';
    showModal();
  }
  function askDeleteFolder(id){
    pendingDeleteFolderId = id; pendingDeleteNoteId = null; pendingDeleteNoteIds = null;
    var f = getFolder(id);
    document.getElementById('modalTitle').textContent = 'Delete folder';
    document.getElementById('modalMessage').textContent = 'Notes in "'+(f?f.name:'this folder')+'" will move to All. This can\'t be undone.';
    document.getElementById('modalConfirm').textContent = 'Delete folder';
    showModal();
  }
  function showModal(){ document.getElementById('modalOverlay').classList.add('show'); }
  function hideModal(){ document.getElementById('modalOverlay').classList.remove('show'); pendingDeleteNoteId=null; pendingDeleteFolderId=null; pendingDeleteNoteIds=null; renderBoard(); }
  function performDelete(){
    if(pendingDeleteNoteIds){
      var gone = {}; pendingDeleteNoteIds.forEach(function(id){ gone[id] = true; });
      notes = notes.filter(function(n){ return !gone[n.id]; });
      persistNotes();
      selectionMode = false; selectedIds = {}; activeCardId = null;
      renderAll(); renderSelectionBar();
    } else if(pendingDeleteNoteId){
      notes = notes.filter(function(n){ return n.id !== pendingDeleteNoteId; });
      persistNotes();
      if(openNoteId === pendingDeleteNoteId){ editorPage.hidden = true; openNoteId = null; }
      if(activeCardId === pendingDeleteNoteId) activeCardId = null;
      renderAll();
    } else if(pendingDeleteFolderId){
      var fid = pendingDeleteFolderId;
      notes.forEach(function(n){ if(n.folderId===fid) n.folderId = null; });
      folders = folders.filter(function(f){ return f.id !== fid; });
      persistNotes(); persistFolders();
      if(selectedFolder === fid) selectedFolder = 'all';
      renderAll();
    }
    hideModal();
  }
  document.getElementById('modalCancel').addEventListener('click', hideModal);
  document.getElementById('modalConfirm').addEventListener('click', performDelete);
  document.getElementById('modalOverlay').addEventListener('mousedown', function(e){ if(e.target.id==='modalOverlay') hideModal(); });

  document.addEventListener('keydown', function(e){
    var mod = e.metaKey || e.ctrlKey;
    if(mod && (e.key==='n'||e.key==='N')){ e.preventDefault(); createItem('note'); }
    else if(e.key === 'Escape'){
      if(!drawOverlay.hidden) drawOverlay.hidden = true;
      else if(!editorPage.hidden) closeEditor();
      else if(document.getElementById('modalOverlay').classList.contains('show')) hideModal();
      else if(fabMenuOpen) setFabMenu(false);
      else if(selectionMode) exitSelectionMode();
    }
  });

  function renderAll(){
    renderBoard();
    if(foldersOpen) renderFoldersPanel();
  }

  // ---------- INIT ----------
  initTheme();
  loadNotesAsync().then(function(list){
    notes = list || [];
    loadState();
    stateLoaded = true;
    if(notesFromLegacy) persistNotes();
    updateArrangeBtn();
    renderAll();
  });
})();
</script>
